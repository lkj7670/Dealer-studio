  h+='<div class="card"><div class="card-h"><div class="card-t"><span class="em">👤</span> 직급 체험</div><div class="card-sub">지금: '+({boss:'사장',manager:'팀장',staff:'사원'})[S.role]+' 시점</div></div>'+
     '<div class="seg" style="width:100%">'+[['boss','사장'],['manager','팀장'],['staff','사원']].map(([k,l])=>
       '<button type="button" data-act="role" data-v="'+k+'" class="'+(S.role===k?'on':'')+'" style="flex:1">'+l+'</button>').join('')+'</div>'+
     '<div class="note" style="margin-top:9px">사원 시점에서는 대시보드가 사라지고 <b>내 일지·내 일정·내 급여</b>만 보입니다. 직급은 실제 계정에서 한 번 정하면 화면이 자동으로 맞춰집니다.</div></div>';
  h+='<div class="card"><div class="card-h"><div class="card-t"><span class="em">🔔</span> 알림 · 보관</div></div>'+
     '<div class="item" style="padding:8px 0"><div class="row nowrap"><div style="flex:1;font-size:12.5px;font-weight:700">업무일지 미보고 알림 (퇴근 30분 전 1회)</div>'+
     '<button type="button" class="btn small '+(c.notify?'soft':'')+'" data-act="toggle-notify">'+(c.notify?'켜짐':'꺼짐')+'</button></div></div>'+
     '<div class="item" style="padding:8px 0"><div class="row nowrap"><div style="flex:1;font-size:12.5px;font-weight:700">사진 보관 기간</div>'+
     '<select class="inp" id="stKeep" style="width:120px;flex:none"><option value="3"'+(c.keepPhoto==='3'?' selected':'')+'>3개월</option><option value="6"'+(c.keepPhoto==='6'?' selected':'')+'>6개월</option></select></div></div>'+
     '<div class="note" style="margin-top:6px">재촉 알림은 보내지 않습니다. 사진은 기간이 지나면 자동 삭제합니다.</div></div>';
  h+='<div class="card"><div class="card-h"><div class="card-t"><span class="em">💾</span> 데이터</div></div>'+
     '<div class="row"><button type="button" class="btn" data-act="backup">내려받기(백업)</button>'+
     '<button type="button" class="btn" data-act="reset">처음 상태로</button></div>'+
     '<div class="note" style="margin-top:9px">입력한 내용은 이 기기의 브라우저에만 저장됩니다. 다른 기기와 자동으로 맞춰지지 않습니다(2단계에서 로그인·동기화).</div></div>';
  $('#pane-set').innerHTML=h;
}

/* ============================================================
   동작
   ============================================================ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const act=el.dataset.act, id=el.dataset.id, v=el.dataset.v;
  if(act==='tab'){goTab(el.dataset.tab);}
  else if(act==='goto'){goTab(el.dataset.tab);}
  else if(act==='mode'){
    const m=el.dataset.mode;
    if(S.mode!==m){S.mode=m;save();}
    if(m==='company'&&view==='shop')view='home';
    render();toast(m==='shop'?'가게 모드로 바꿨습니다':'회사 모드로 바꿨습니다');
  }
  else if(act==='read'){
    const n=S.notices.find(x=>x.id===id); if(!n)return;
    n.readBy=n.readBy||[]; if(!n.readBy.includes(meId())){n.readBy.push(meId());save();}
    render();toast('읽음 확인했습니다');
  }
  else if(act==='todo'){
    const t=S.todos.find(x=>x.id===id); if(!t)return;
    t.done=!t.done; save(); render();
  }
  else if(act==='quicklog'){
    const inp=$('#quickLog'); const val=(inp&&inp.value||'').trim();
    if(!val){toast('한 일을 한 줄 적어 주세요');return;}
    const t=todayISO(); let l=S.logs.find(x=>x.date===t&&x.who===meId());
    if(!l){l={id:uid(),date:t,who:meId(),lines:[],status:'진행중',photos:[],at:nowISO()};S.logs.push(l);}
    l.lines=[val].concat((l.lines||[]).slice(0,2));
    l.at=nowISO(); save(); render(); toast('업무일지에 남겼습니다');
  }
  else if(act==='addnotice'){
    const ti=$('#ntTitle'), bo=$('#ntBody'), sc=$('#ntScope');
    const title=(ti.value||'').trim(); if(!title){toast('공지 제목을 적어 주세요');ti.focus();return;}
    S.notices.unshift({id:uid(),scope:sc.value,title:title,body:(bo.value||'').trim(),at:nowISO(),by:tname(meId()),readBy:[meId()]});
    save(); render(); toast('공지를 올렸습니다');
  }
  else if(act==='lgstatus'){
    S.logDraft.status=v; save(); renderLog();
  }
  else if(act==='delphoto'){
    S.logDraft.photos=spliceOne(S.logDraft.photos,Number(el.dataset.i)); save(); renderLog();
  }
  else if(act==='savelog'){
    const lines=[0,1,2].map(i=>{const el=$('#lg'+i);return el?(el.value||'').trim():'';});
    if(!lines[0]){toast('1번 칸(오늘 한 일)은 꼭 적어 주세요');const f=$('#lg0');if(f)f.focus();return;}
    const t=todayISO();
    let l=S.logs.find(x=>x.date===t&&x.who===meId());
    if(!l){l={id:uid(),date:t,who:meId(),lines:[],status:'진행중',photos:[],at:nowISO()};S.logs.push(l);}
    l.lines=lines; l.status=S.logDraft.status||'진행중'; l.photos=(S.logDraft.photos||[]).slice(0,2); l.at=nowISO();
    if(save()){ S.logDraft={lines:['','',''],status:'진행중',photos:[]}; save(); renderLog(); toast('일지를 보냈습니다'); }
  }
  else if(act==='logfilter'){S.logFilter=v;save();renderLog();}
  else if(act==='caltab'){S.calTab=v;save();renderCal();}
  else if(act==='confirm'){
    const s=S.sched.find(x=>x.id===id); if(!s)return;
    s.confirmed=s.confirmed||[]; if(!s.confirmed.includes(meId())){s.confirmed.push(meId());save();}
    renderCal();toast('확인 표시했습니다');
  }
  else if(act==='addsched'){
    const ti=$('#scTitle'), dt=$('#scDate');
    const title=(ti.value||'').trim(); if(!title){toast('일정 내용을 적어 주세요');ti.focus();return;}
    S.sched.push({id:uid(),date:dt.value||isoOff(1),title:title,type:'company',by:tname(meId()),confirmed:[meId()]});
    save();renderCal();toast('스케줄을 올렸습니다');
  }
  else if(act==='addpersonal'){
    const ti=$('#psTitle'), dt=$('#psDate'), mm=$('#psMemo');
    const title=(ti.value||'').trim(); if(!title){toast('일정 내용을 적어 주세요');ti.focus();return;}
    S.sched.push({id:uid(),date:dt.value||isoOff(1),title:title,type:'personal',who:meId(),memo:(mm.value||'').trim()});
    save();renderCal();toast('내 일정에 넣었습니다');
  }
  else if(act==='taxcat'){taxCat=v;taxShowAll=false;$$('#taxCats button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));filterTax();}
  else if(act==='taxall'){
    if(taxQuery&&!taxShowAll)taxShowAll=true; else taxShowAll=!taxShowAll;
    filterTax();
  }
  else if(act==='punch'){
    const t=todayISO(); const a=S.att[meId()]||{};
    if(v==='in'){S.att[meId()]={date:t,'in':nowHM(),out:a.date===t?(a.out||null):null};toast(P.att+' 기록했습니다');}
    else{
      if(a.date!==t){toast('오늘 '+P.att+' 기록이 없습니다');return;}
      a.out=nowHM();S.att[meId()]=a;toast('퇴근 기록했습니다');
    }
    save();renderAtt();
  }
  else if(act==='role'){S.role=v;if(!['docs','set','att'].includes(view)){}save();render();toast(({boss:'사장',manager:'팀장',staff:'사원'})[v]+' 시점으로 봅니다');}
  else if(act==='toggle-notify'){S.company.notify=!S.company.notify;save();renderSet();toast(S.company.notify?'알림을 켰습니다':'알림을 껐습니다');}
  else if(act==='savecompany'){
    S.company.name=($('#stName').value||'').trim()||'YL 솔루션';
    S.company.start=$('#stStart').value||'09:00';
    S.company.end=$('#stEnd').value||'18:00';
    S.company.payday=$('#stPayday').value||'10';
    const kp=$('#stKeep'); if(kp)S.company.keepPhoto=kp.value;
    save();render();toast('설정을 저장했습니다');
  }
  else if(act==='backup'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='yl-solution-company-'+todayISO()+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    toast('백업 파일을 내려받았습니다');
  }
  else if(act==='reset'){
    if(!confirm('입력한 공지·일지·일정이 모두 지워지고 처음 예시 상태로 돌아갑니다. 계속할까요?'))return;
    try{localStorage.removeItem(KEY);}catch(e){}
    S=seed(); view='home'; render(); toast('처음 상태로 돌아갔습니다');
  }
  else if(act==='soon'){toast('2단계에서 열립니다');}
});
function spliceOne(arr,i){const a=(arr||[]).slice();a.splice(i,1);return a;}
function nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

document.addEventListener('change',e=>{
  if(e.target.id==='stKeep'){S.company.keepPhoto=e.target.value;save();toast('사진 보관 기간을 '+e.target.value+'개월로 바꿨습니다');return;}
  if(e.target.id==='stPreset'||e.target.id==='presetSel'){
    S.preset=e.target.value;save();render();
    toast('업종 프리셋을 '+PRESETS[S.preset].name+'로 바꿨습니다 — 용어가 '+PRESETS[S.preset].place+'·'+PRESETS[S.preset].pay+'(으)로 바뀝니다');
  }
});
/* 업무일지 입력값 유지 */
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='lg0'||id==='lg1'||id==='lg2'){
    const i=Number(id.slice(2)); S.logDraft.lines[i]=e.target.value;
  }
});

/* ---------- 새로고침 · 버전 ---------- */
$('#reloadBtn').addEventListener('click',()=>{
  const b=$('#reloadBtn'); b.classList.add('spin');
  try{const u=new URL(location.href);u.searchParams.set('r',String(Date.now()));location.replace(u.toString());}
  catch(e){location.reload();}
  setTimeout(()=>b.classList.remove('spin'),1200);
});
function showVersionPopup(v,notes){
  $('#verVer').textContent='버전 '+(v||APP_VERSION);
  const ul=$('#verNotes'); ul.innerHTML='';
  (notes&&notes.length?notes:VER_NOTES[APP_VERSION]||[]).forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li);});
  $('#verPop').classList.add('open');
}
$('#verClose').addEventListener('click',()=>{ $('#verPop').classList.remove('open'); try{localStorage.setItem(SEEN_KEY,APP_VERSION);}catch(e){} });
$('#verReload').addEventListener('click',()=>{
  try{localStorage.setItem(SEEN_KEY,APP_VERSION);}catch(e){}
  const b=$('#reloadBtn'); if(b)b.classList.add('spin');
  try{const u=new URL(location.href);u.searchParams.set('r',String(Date.now()));location.replace(u.toString());}
  catch(e){location.reload();}
});
let verBusy=false;
function checkVersion(){
  if(verBusy||document.hidden)return;
  if($('#verPop').classList.contains('open'))return;
  verBusy=true;
  fetch('company-version.json?t='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.json():null)
    .then(j=>{verBusy=false;
      if(!j||!j.v)return;
      if(j.v!==APP_VERSION){ showVersionPopup(j.v,j.notes); }
    })
    .catch(()=>{verBusy=false;});
}
function bootVersion(){
  try{ const seen=localStorage.getItem(SEEN_KEY); if(seen!==APP_VERSION)setTimeout(()=>showVersionPopup(APP_VERSION,VER_NOTES[APP_VERSION]),500); }catch(e){}
  setTimeout(checkVersion,1600);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(checkVersion,900);});
  setInterval(()=>{if(!document.hidden)checkVersion();},10*60*1000);
}

/* ---------- 시작 ---------- */
view='home';
render();
bootVersion();
</script>
