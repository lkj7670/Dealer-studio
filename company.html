<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#111827; --ink2:#374151; --muted:#6b7280;
  --line:#e5e8ee; --line2:#d3d9e4;
  --brand:#1d4ed8; --brand2:#2563eb; --soft:#eff4ff; --brandline:#c7d8fb;
  --ok:#12703a; --okbg:#e9f7ee; --okline:#bfe3cb;
  --warn:#9a5b06; --warnbg:#fff7e8; --warnline:#f0d9a8;
  --bad:#b3261e; --badbg:#fdeeed; --badline:#f3c9c6;
  --r:14px; --rs:10px; --sh:0 1px 2px rgba(17,24,39,.05), 0 1px 8px rgba(17,24,39,.03);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:13.5px; line-height:1.45; -webkit-text-size-adjust:100%;
  padding-bottom:calc(env(safe-area-inset-bottom) + 22px);
}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
button{cursor:pointer}
.hidden{display:none !important}
.wrap{max-width:880px;margin:0 auto;padding:0 12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.tiny{font-size:10.5px}

/* ---------- 헤더 ---------- */
.app-head{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 1px 4px rgba(17,24,39,.06);padding-top:env(safe-area-inset-top)}
.head-row{max-width:880px;margin:0 auto;padding:9px 12px 6px;display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,#2563eb,#1d4ed8);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;box-shadow:0 1px 4px rgba(29,78,216,.3)}
.head-title{font-size:15px;font-weight:800;letter-spacing:-.4px;line-height:1.15;white-space:nowrap}
.head-sub{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-spacer{flex:1}
.mode-switch{display:flex;background:#eef1f6;border:1px solid var(--line2);border-radius:999px;padding:2px;flex:none}
.mode-switch button{border:0;background:transparent;color:#4b5563;font-size:11.5px;font-weight:700;
  padding:5px 9px;border-radius:999px;line-height:1.1}
.mode-switch button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(17,24,39,.14)}
.icon-btn{min-width:34px;height:32px;border-radius:10px;border:1px solid var(--line2);background:#fff;
  display:flex;align-items:center;justify-content:center;padding:0 6px;flex:none}
.reload-btn{font-size:16px;font-weight:800;min-width:40px;color:#0b3d91;border-color:#c7d4ea;background:#f5f9ff}
.reload-btn.spin{animation:rlspin .7s linear infinite}
@keyframes rlspin{to{transform:rotate(360deg)}}
.head-row2{max-width:880px;margin:0 auto;padding:0 12px 7px;display:flex;gap:7px;align-items:center}
.preset{flex:1;min-width:0;height:30px;border-radius:9px;border:1px solid var(--line2);background:#fbfcfe;
  padding:0 8px;font-size:12px;font-weight:700;color:var(--ink2)}
.role-chip{flex:none;height:30px;border-radius:9px;border:1px solid var(--brandline);background:var(--soft);
  color:var(--brand);font-size:11.5px;font-weight:800;padding:0 10px}
.tabs{max-width:880px;margin:0 auto;display:flex;gap:4px;padding:0 8px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-width:60px;border:1px solid #e8ebf1;background:#f7f9fc;border-radius:10px;
  padding:5px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1}
.tab .ti{font-size:14px}
.tab .tt{font-size:10.5px;font-weight:700;color:#4b5563;white-space:nowrap}
.tab.on{background:#fff;border-color:var(--brandline);box-shadow:0 1px 3px rgba(29,78,216,.12)}
.tab.on .tt{color:var(--brand)}

/* ---------- 공통 카드 ---------- */
main{padding-top:10px}
.pane{display:none}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:13px 13px;margin-bottom:10px}
.card-h{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.card-t{font-size:13.5px;font-weight:800;letter-spacing:-.3px}
.card-t .em{font-size:14px}
.card-sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-left:auto;flex:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat.wide{grid-column:1/-1}
@media (min-width:720px){.stat.wide{grid-column:auto}}
.hero{background:linear-gradient(160deg,#1d4ed8,#2563eb 60%,#3b82f6);color:#fff;border:0}
.hero .card-t{color:#fff}
.hero .muted{color:rgba(255,255,255,.8)}
.hello{font-size:15.5px;font-weight:800;letter-spacing:-.4px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;box-shadow:var(--sh)}
.stat .lbl{font-size:11.5px;color:var(--muted);font-weight:700}
.stat .val{font-size:20px;font-weight:800;letter-spacing:-.6px;margin-top:2px;line-height:1.15}
.stat .val small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}
.stat .foot{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.bar{height:7px;border-radius:999px;background:#eef1f6;overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2563eb,#60a5fa)}
.bar.ok > i{background:linear-gradient(90deg,#15803d,#4ade80)}
.bar.warn > i{background:linear-gradient(90deg,#b45309,#fbbf24)}
.alert{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:10px 11px;margin-bottom:8px;
  border:1px solid var(--warnline);background:var(--warnbg);color:#7c4a06;font-size:12.5px;font-weight:600}
.alert.bad{border-color:var(--badline);background:var(--badbg);color:#8c1d18}
.alert.ok{border-color:var(--okline);background:var(--okbg);color:#14532d}
.alert b{font-weight:800}
.btn{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 11px;font-weight:700;font-size:12.5px}
.btn:active{background:#f3f5f9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:active{background:#1a43bd}
.btn.soft{background:var(--soft);border-color:var(--brandline);color:var(--brand)}
.btn.small{padding:5px 9px;font-size:11.5px;border-radius:8px}
.btn.full{width:100%;display:block;text-align:center}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:12px;font-weight:700;color:#4b5563}
.seg button.on{background:var(--brand);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;
  border:1px solid var(--line2);background:#f8fafc;color:#4b5563;white-space:nowrap}
.chip.ok{background:var(--okbg);border-color:var(--okline);color:var(--ok)}
.chip.warn{background:var(--warnbg);border-color:var(--warnline);color:var(--warn)}
.chip.bad{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
.chip.brand{background:var(--soft);border-color:var(--brandline);color:var(--brand)}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0;padding-top:2px}
.item-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-t{font-size:13px;font-weight:800;letter-spacing:-.2px}
.item-m{font-size:11px;color:var(--muted);font-weight:600}
.line3{display:flex;flex-direction:column;gap:3px;margin-top:5px}
.line3 div{font-size:12.5px;color:var(--ink2);padding-left:11px;position:relative}
.line3 div:before{content:'·';position:absolute;left:3px;color:#9aa3b2;font-weight:800}
.note{font-size:11.5px;color:#4b5563;background:#f7f9fc;border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;line-height:1.5}
.field{margin-bottom:9px}
.field label{display:block;font-size:11.5px;font-weight:800;color:#4b5563;margin-bottom:4px}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:#fff;
  font-size:13px;line-height:1.4}
textarea.inp{resize:vertical;min-height:38px}
.inp:focus{outline:2px solid #c7d8fb;border-color:var(--brand2)}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:16px 6px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.thumb{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);background:#f3f5f9}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;border:0;
  background:rgba(17,24,39,.72);color:#fff;font-size:11px;line-height:19px;padding:0}
.filebtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--brandline);background:var(--soft);
  color:var(--brand);border-radius:10px;padding:8px 11px;font-weight:800;font-size:12.5px}
.filebtn input{display:none}
.link-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.link-row:first-of-type{border-top:0}
.link-row .ic{width:32px;height:32px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.link-row .tx{flex:1;min-width:0}
.link-row .tx b{display:block;font-size:12.5px}
.link-row .tx span{font-size:11px;color:var(--muted)}
.link-row .go{color:#9aa3b2;font-weight:800}

/* ---------- 탭 안쪽 헤더 ---------- */
.pane-h{display:flex;align-items:baseline;gap:7px;margin:2px 2px 9px}
.pane-h h1{font-size:16px;font-weight:800;letter-spacing:-.4px;margin:0}
.pane-h span{font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- 세무회계 ---------- */
.searchwrap{position:relative}
.searchwrap .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;color:#9aa3b2}
.searchwrap input{width:100%;border:1px solid var(--line2);border-radius:12px;padding:11px 12px 11px 33px;font-size:13.5px;background:#fff}
.chips{display:flex;gap:5px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 10px;
  font-size:11.5px;font-weight:700;color:#4b5563}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
details.qa{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:7px;overflow:hidden}
details.qa summary{list-style:none;cursor:pointer;padding:10px 11px;display:flex;gap:7px;align-items:flex-start}
details.qa summary::-webkit-details-marker{display:none}
details.qa .qno{font-size:10.5px;font-weight:800;color:var(--brand);background:var(--soft);border:1px solid var(--brandline);
  border-radius:6px;padding:1px 5px;flex:none;margin-top:1px}
details.qa .qt{font-size:12.5px;font-weight:800;letter-spacing:-.2px;flex:1;line-height:1.4}
details.qa .caret{color:#9aa3b2;font-size:10px;font-weight:800;margin-top:3px}
details.qa[open] .caret{transform:rotate(180deg)}
.qa-b{padding:0 11px 11px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.qa-b .ans{background:var(--soft);border:1px solid var(--brandline);border-radius:9px;padding:8px 10px;font-weight:700;color:#173a8a;margin-bottom:7px}
.qa-b .more{margin-bottom:7px}
.qa-b .basis{font-size:11px;color:var(--muted);margin-bottom:6px;line-height:1.5}
.qa-b .basis a{color:var(--brand);text-decoration:none;border-bottom:1px solid var(--brandline)}
.qa-b .expert{font-size:11.5px;background:var(--warnbg);border:1px solid var(--warnline);border-radius:8px;padding:7px 9px;color:#7c4a06}
details.gd{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:7px;overflow:hidden}
details.gd summary{list-style:none;cursor:pointer;padding:11px;font-size:12.5px;font-weight:800;display:flex;gap:7px;align-items:center}
details.gd summary::-webkit-details-marker{display:none}
details.gd summary .gdn{font-size:11px;font-weight:800;color:#fff;background:var(--brand);border-radius:6px;padding:1px 6px;flex:none}
.gd-b{padding:0 11px 11px}
.gd-b ol{margin:0;padding-left:16px}
.gd-b li{font-size:12.5px;margin-bottom:7px;line-height:1.5;color:var(--ink2)}
.gd-b li b{color:var(--ink);display:block}
.tel{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.tel:first-of-type{border-top:0}
.tel .no{font-size:15px;font-weight:800;color:var(--brand);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.tel .nm{font-size:11px;color:var(--muted);font-weight:700}
.tel a.call{margin-left:auto;border:1px solid var(--brandline);background:var(--soft);color:var(--brand);
  border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:800;text-decoration:none}
.tel a.call[aria-disabled="true"]{opacity:.55}

/* ---------- 토스트 · 팝업 ---------- */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,14px);
  background:rgba(17,24,39,.93);color:#fff;font-size:12.5px;font-weight:700;padding:10px 15px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#verPop{position:fixed;inset:0;z-index:300;background:rgba(17,24,39,.46);display:none;align-items:center;justify-content:center;padding:18px}
#verPop.open{display:flex}
.ver-card{background:#fff;border-radius:18px;max-width:370px;width:100%;padding:19px 17px 15px;box-shadow:0 14px 40px rgba(17,24,39,.3)}
.ver-title{font-size:16px;font-weight:800;letter-spacing:-.4px}
.ver-ver{font-size:11px;color:var(--muted);font-weight:700;margin:2px 0 11px}
.ver-notes{margin:0 0 12px;padding:0;list-style:none;font-size:13px;line-height:1.6}
.ver-notes li{padding-left:14px;position:relative;color:var(--ink2)}
.ver-notes li:before{content:'•';position:absolute;left:2px;color:var(--brand);font-weight:800}
.ver-btns{display:flex;gap:8px}
.ver-btns .btn{flex:1}

/* ---------- 데스크톱 ---------- */
@media (min-width:720px){
  body{font-size:14px}
  .head-title{font-size:16px}
  .tab{min-width:66px}
  .card{padding:15px 16px;margin-bottom:12px}
  .grid2{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<header class="app-head">
  <div class="head-row">
    <div class="brand">
