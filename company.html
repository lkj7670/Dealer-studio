const TAX={"checked":"2026-11-28","items":[{"no":1,"cat":"사업자·기본","q":"사업자등록은 언제까지 해야 해요?","short":"사업을 시작한 날부터 **20일 이내**에 사업장 관할 세무서에 신청합니다. 시작하기 전에도 미리 낼 수 있습니다.","more":"20일을 넘기면 사업 개시일부터 등록 신청일 전날까지의 공급가액 합계액에 **1% 가산세**가 붙습니다. 등록 없이 거래하면 매입세액 공제도 받지 못해 손해가 두 배가 됩니다. 왜 20일이냐면, 세무서가 사업자를 파악해 부가세·소득세 고지와 신고 관리를 시작하는 기준일이기 때문입니다. 업종·주소·임대차 계약서를 준비해 홈택스에서도 신청할 수 있습니다.","basis":"「부가가치세법」 제8조 제1항(등록 기한), 제60조 제1항 제1호(미등록 가산세 1%) · [국가법령정보센터](https://www.law.go.kr/법령/부가가치세법/제8조) · 확인 2026-11-28","expert":"업종이 여럿이거나(예: 도급 + 임대), 사업장이 두 곳 이상이거나, 기존 사업자의 사업을 넘겨받는 경우에는 과세유형·사업자 단위 과세 문제가 생깁니다. 세무사나 국세청(126)에 먼저 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/부가가치세법/제8조"}],"basis_text":"「부가가치세법」 제8조 제1항(등록 기한), 제60조 제1항 제1호(미등록 가산세 1%) ·  · 확인 2026-11-28"},{"no":2,"cat":"사업자·기본","q":"일반과세와 간이과세는 뭐가 달라요?","short":"직전 연도 매출(부가세 포함 공급대가)이 **1억 400만원 미만**인 개인사업자면 간이과세 대상인 경우가 많고, 그 이상이거나 배제 업종이면 일반과세입니다.","more":"일반과세자는 매출의 10%를 세금으로 내되 매입세액을 전액 공제받고 환급도 가능합니다. 간이과세자는 업종별 부가가치율(15~40%)을 곱해 계산해 세율이 낮은 대신, 매입 공제가 공급대가의 0.5%로 제한되고 환급이 없습니다. 부동산임대업과 과세유흥장소는 4,800만원 미만이 기준이고, 광업·제조업·도매업 등은 매출이 적어도 간이과세를 적용받지 못합니다. 왜 나누냐면, 장부·증빙 능력이 다른 영세 사업자의 부담을 덜어 주려는 제도이기 때문입니다. 일반과세자에서 간이과세자로는 자동 전환되지만, 반대로 임의 전환은 되지 않습니다.","basis":"「부가가치세법」 제61조, 같은 법 시행령 제109조(1억 400만원) · [국세청 간이과세 안내](https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11937&mi=1329) · 확인 2026-11-28","expert":"매출이 기준선 근처에서 오르내리거나, 업종을 겸업하거나, 프랜차이즈·부동산임대가 섞여 있으면 유형 판정이 갈립니다. 세무사에게 유형 판정을 맡기세요. 정확한 판단은 세무사나 국세청(126)에 확인하세요.","staff":false,"links":[{"t":"국세청 간이과세 안내","u":"https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11937&mi=1329"}],"basis_text":"「부가가치세법」 제61조, 같은 법 시행령 제109조(1억 400만원) ·  · 확인 2026-11-28"},{"no":3,"cat":"사업자·기본","q":"간이과세자인데 세금계산서를 떼 줄 수 있나요?","short":"직전 연도 공급대가가 **4,800만원 이상**인 간이과세자는 세금계산서를 발급해야 하고, 4,800만원 미만이거나 신규 개업이면 영수증을 발급합니다.","more":"2021년 7월부터 바뀐 규칙입니다. 거래처가 \"세금계산서를 달라\"고 하는데 우리가 영수증 발급 대상이면, 거래처는 매입세액을 공제받지 못해 거래가 끊기는 경우가 많습니다. 반대로 우리가 4,800만원 이상이면 발급 의무가 생기고, 발급하지 않으면 가산세 대상입니다. 왜 나누냐면, 소비자 상대 매출이 많은 영세 사업자에게까지 세금계산서 의무를 지우지 않으려는 것입니다. 상반기에 세금계산서를 한 번이라도 발급한 간이과세자는 7월 25일까지 예정신고를 해야 합니다.","basis":"「부가가치세법」 제36조, 제61조, 제67조 · [국세청 간이과세 Q&A(세금계산서)](https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11937&mi=1329) · 확인 2026-11-28","expert":"거래처가 원청·대기업이라 세금계산서 발급을 계약 조건으로 요구하는 경우, 발급을 위해 일반과세로 전환하는 것이 유리한지 계산이 필요합니다. 세무사와 상담하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 간이과세 Q&A(세금계산서)","u":"https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11937&mi=1329"}],"basis_text":"「부가가치세법」 제36조, 제61조, 제67조 ·  · 확인 2026-11-28"},{"no":4,"cat":"사업자·기본","q":"사업자 없이 프리랜서로 일하면 세금은 어떻게 되나요?","short":"돈을 받을 때 **3.3%**(소득세 3% + 지방소득세 0.3%)를 떼이고, 다음 해 5월에 다른 소득과 합쳐 종합소득세로 정산합니다.","more":"3.3%는 \"세금을 다 낸 것\"이 아니라 미리 떼어 둔 것입니다. 경비(재료비·교통비·통신비 등)를 증빙으로 남겨 두면 5월 신고에서 돌려받는 경우가 많습니다. 사업자등록이 없어도 사업소득은 발생할 수 있지만, 계속·반복적으로 일한다면 사업자등록을 하는 쪽이 거래처도 안심하고 경비 처리도 쉬워집니다. 왜 3.3%냐면, 소득을 받는 즉시 세원을 확보하려는 원천징수 제도입니다.","basis":"「소득세법」 제129조 제1항 제3호(사업소득 3%) · [국세청 사업소득 안내](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7902&mi=6466) · 확인 2026-11-28","expert":"한 해 인적용역 소득이 커지거나, 3.3%로 받은 돈이 실제로는 근로(직원처럼 일함)에 가까우면 세무조사·근로자성 다툼이 생깁니다. 세무사·노무사에게 확인하세요. 정확한 판단은 세무사나 국세청(126)에 확인하세요.","staff":false,"links":[{"t":"국세청 사업소득 안내","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7902&mi=6466"}],"basis_text":"「소득세법」 제129조 제1항 제3호(사업소득 3%) ·  · 확인 2026-11-28"},{"no":5,"cat":"사업자·기본","q":"사업용 계좌를 꼭 만들어야 하나요?","short":"**복식부기 의무자**는 사업용 계좌를 만들어 과세기간 개시일부터 6개월 안에 신고해야 합니다. 간편장부 대상자는 의무가 아닙니다.","more":"복식부기 의무자는 업종별 직전 매출 기준(뒤 Q45 참고)을 넘는 사업자입니다. 사업용 계좌는 사업과 관련된 대금 결제, 인건비·임차료 지급에 써야 하고, 사업과 무관한 용도로 쓰면 요건을 못 갖춥니다. 계좌를 섞으면 경비 증빙이 흐려져 세금이 늘고, 조사에서 가사비용으로 걸리는 경우가 많습니다. 왜 요구하냐면, 현금 거래가 많은 업종에서 소득 파악을 가능하게 하려는 제도입니다. 계좌를 안 쓰면 사용해야 할 금액에 대해 가산세가 붙습니다.","basis":"「소득세법」 제160조의5(신고·사용 의무), 같은 법 시행령 제208조의5 · [국가법령정보센터](https://www.law.go.kr/법령/소득세법/제160조의5) · 확인 2026-11-28","expert":"이미 여러 계좌를 섞어 썼거나, 가산세가 부과된 경우에는 정정·소명 방법이 따로 있습니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/소득세법/제160조의5"}],"basis_text":"「소득세법」 제160조의5(신고·사용 의무), 같은 법 시행령 제208조의5 ·  · 확인 2026-11-28"},{"no":6,"cat":"사업자·기본","q":"가게를 잠시 쉬거나 닫으면 어떻게 해요?","short":"**휴업·폐업 신고**를 하고, 폐업이면 폐업한 달의 다음 달 **25일까지** 부가세 확정신고를 합니다.","more":"폐업 신고만 하고 부가세 신고를 빠뜨리는 실수가 가장 많습니다. 둘은 별개 절차입니다. 폐업 신고는 홈택스나 세무서에 하고, 사업자등록증을 반납합니다. 폐업 신고 때 남은 재고·비품은 \"잔존재화\"로 보아 부가세 과세 대상이 됩니다(Q51). 휴업 중에도 임차료 세금계산서 매입세액은 신고 때 공제받을 수 있습니다. 왜 폐업 신고를 따로 요구하냐면, 세무서가 사업 종료 시점을 기준으로 마지막 신고 범위를 정하기 때문입니다. 직원이 있으면 4대보험 상실 신고도 함께 해야 합니다.","basis":"「부가가치세법」 제8조 제8항(휴업·폐업 신고), 제67조 제1항(폐업일이 속한 달의 다음 달 25일) · [국세청 휴업·폐업 안내](https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2448&nttSn=1393) · 확인 2026-11-28","expert":"재고가 많거나, 권리금·시설을 함께 넘기거나, 직원 정리와 미지급 급여가 남아 있으면 폐업 신고 전에 세무사·노무사와 순서를 맞춰야 합니다. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 휴업·폐업 안내","u":"https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2448&nttSn=1393"}],"basis_text":"「부가가치세법」 제8조 제8항(휴업·폐업 신고), 제67조 제1항(폐업일이 속한 달의 다음 달 25일) ·  · 확인 2026-11-28"},{"no":7,"cat":"부가세","q":"부가세는 언제 신고해요?","short":"개인 일반과세자는 **7월 25일**(1~6월분)과 **다음 해 1월 25일**(7~12월분), 간이과세자는 다음 해 1월 25일에 한 번, 법인은 4·7·10·다음 해 1월 25일에 신고합니다.","more":"신고일이 토요일·공휴일이면 다음 영업일로 밀립니다. 개인 일반과세자 중 규모가 작은 사업자는 4월·10월에 예정고지서로 전기 납부세액의 50%를 내고, 이 돈은 7월·1월 확정신고에서 빼 줍니다(고지세액 50만원 미만이면 제외). 신고만 하고 납부를 안 하면 납부지연가산세가 하루 단위로 붙으므로, 신고와 납부를 같은 날 끝내는 습관이 안전합니다. 왜 6개월 단위냐면, 개인사업자의 장부 부담을 줄이려는 것입니다.","basis":"「부가가치세법」 제48조·제49조, 제60조 · [국세청 부가세 신고납부기한](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7802&mi=2225) · 확인 2026-11-28","expert":"신고 기한이 임박했는데 매출·매입 자료가 맞지 않으면, 추정으로 넣지 말고 세무사에게 먼저 보여 주세요. 수정신고로 줄일 수 있는 경우가 있습니다. 정확한 판단은 세무사나 국세청(126)에 확인하세요.","staff":false,"links":[{"t":"국세청 부가세 신고납부기한","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7802&mi=2225"}],"basis_text":"「부가가치세법」 제48조·제49조, 제60조 ·  · 확인 2026-11-28"},{"no":8,"cat":"부가세","q":"세금계산서와 현금영수증은 뭐가 달라요?","short":"**세금계산서**는 사업자끼리 주고받는 증빙이고, **현금영수증**은 주로 소비자에게 주는 증빙입니다. 둘 다 매입세액 공제 근거가 됩니다.","more":"세금계산서는 상대 사업자의 사업자번호와 공급가액·세액이 적혀, 받는 쪽이 매입세액을 전액 공제하는 근거가 됩니다. 현금영수증은 소비자의 소득공제용이지만, 사업자가 사업용 카드·현금영수증으로 받으면 그 부가세를 공제받을 수 있습니다. 면세사업자(학원·병원 등)는 세금계산서 대신 **계산서**를 발급합니다. 왜 구분하냐면, 부가세를 떼어 낼 수 있는 거래인지 아닌지가 증빙 종류로 드러나기 때문입니다. 사업자에게 현금영수증을 끊으면 그 사업자가 매입세액을 공제받지 못해 거래처가 싫어하는 경우도 있습니다.","basis":"「부가가치세법」 제32조(세금계산서), 제36조(영수증), 제46조 제3항(카드전표 매입공제) · [국세청 부가세 개요](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7694&mi=2272) · 확인 2026-11-28","expert":"거래처가 \"세금계산서 아니면 결제 안 한다\"고 하거나, 발급한 증빙이 실제 거래와 다르다고 다툼이 생기면 세무사에게 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 부가세 개요","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7694&mi=2272"}],"basis_text":"「부가가치세법」 제32조(세금계산서), 제36조(영수증), 제46조 제3항(카드전표 매입공제) ·  · 확인 2026-11-28"},{"no":9,"cat":"부가세","q":"세금계산서는 언제 발급하나요?","short":"원칙적으로 **재화를 넘겨주거나 용역을 끝낸 때**(공급시기)이고, 같은 달 거래를 모아 **다음 달 10일까지** 발급하는 방법도 있습니다.","more":"공급시기보다 먼저 돈을 받으면 대금을 받은 때가 발급시기가 됩니다. 전자세금계산서는 발급기한의 다음 날까지 발급해도 가산세가 없는 경우가 있습니다. 발급을 늦추거나 거래 내용과 다르게 적으면 가산세와 매입세액 불공제로 이어지고, 상대 사업자에게 피해가 갑니다. 왜 공급시기를 기준으로 하냐면, 부가세 과세표준을 거래가 실제로 일어난 과세기간에 잡기 위해서입니다. 월합계 발급을 쓰면 매 건마다 끊는 번거로움을 줄일 수 있습니다.","basis":"「부가가치세법」 제34조(발급시기), 같은 법 시행령 제68조(월합계) · [국가법령정보센터](https://www.law.go.kr/법령/부가가치세법/제34조) · 확인 2026-11-28","expert":"공사·용역처럼 대금을 나눠 받거나, 검사·인수 시점이 계약서마다 다른 경우에는 공급시기 판단이 어렵습니다. 세무사에게 계약서를 보여 주고 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/부가가치세법/제34조"}],"basis_text":"「부가가치세법」 제34조(발급시기), 같은 법 시행령 제68조(월합계) ·  · 확인 2026-11-28"},{"no":10,"cat":"부가세","q":"매입세액 공제가 안 되는 게 있나요?","short":"**접대비, 비영업용 승용차, 면세사업 관련 지출, 세금계산서를 못 받은 매입, 사업과 직접 관련 없는 지출**은 공제되지 않습니다.","more":"세금계산서를 받았어도 필요적 기재사항이 빠지거나 사실과 다르면 공제되지 않습니다. 다만 사업자에게서 부가세가 따로 표시된 카드전표를 받고 수령명세서를 내면 매입세액으로 인정되는 길이 있습니다. 접대비는 비용(소득세)으로는 한도 내 인정되지만 부가세는 공제되지 않습니다. 왜 막냐면, 최종 소비에 가까운 지출까지 사업 비용으로 세금을 돌려주면 부가세 구조가 무너지기 때문입니다. 카드에 자동으로 잡혔다고 그대로 신고하면 안 되고, 사용처를 확인해야 합니다.","basis":"「부가가치세법」 제39조(공제하지 않는 매입세액), 제46조 제3항 · [국가법령정보센터](https://www.law.go.kr/법령/부가가치세법/제39조) · 확인 2026-11-28","expert":"차량을 업무와 가족용으로 같이 쓰거나, 과세·면세 사업을 겸영하거나, 접대성 지출이 섞여 있으면 공제 금액이 크게 달라집니다. 세무사와 정리하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/부가가치세법/제39조"}],"basis_text":"「부가가치세법」 제39조(공제하지 않는 매입세액), 제46조 제3항 ·  · 확인 2026-11-28"},{"no":11,"cat":"부가세","q":"카드 매출 세액공제가 있나요?","short":"개인사업자가 카드·현금영수증으로 받은 금액의 **1.3%**(연 1,000만원 한도)를 부가세에서 빼 줍니다. 이 우대는 **2026년 12월 31일까지**입니다.","more":"음식점업·숙박업을 하는 **간이과세자**는 2.6%가 적용됩니다. 법인은 대상이 아니고, 직전 연도 공급가액이 사업장 기준 10억원을 넘는 개인사업자도 빠집니다. 공제액이 낼 세금보다 크면 초과분은 없어지고 현금으로 돌려받지 못합니다. 2027년부터는 1%·연 500만원으로 돌아가는 것이 현행 법이고, 정부는 1.2%·500만원으로 바꾸는 개정안을 국회에 내 놓은 상태입니다(확정 아님). 왜 주냐면, 카드·현금영수증 발급을 늘려 거래를 투명하게 하려는 것입니다. 배달앱 결제분도 거래명세로 확인되면 대상에 넣는 경우가 많습니다.","basis":"「부가가치세법」 제46조 제1항 제3호(1.3%, 1,000만원, 2026.12.31까지), 제46조 제2항(초과분 소멸) · [국가법령정보센터](https://law.go.kr/LSW/lsLawLinkInfo.do?chrClsCd=010202&lsJoLnkSeq=900329061) · 확인 2026-11-28","expert":"카드 매출과 세금계산서 발급분이 겹치거나, 업종이 여럿이면 공제 대상 매출을 나눠야 합니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://law.go.kr/LSW/lsLawLinkInfo.do?chrClsCd=010202&lsJoLnkSeq=900329061"}],"basis_text":"「부가가치세법」 제46조 제1항 제3호(1.3%, 1,000만원, 2026.12.31까지), 제46조 제2항(초과분 소멸) ·  · 확인 2026-11-28"},{"no":12,"cat":"부가세","q":"간이과세자는 부가세를 어떻게 계산해요?","short":"매출(부가세 포함) × **업종별 부가가치율(15~40%)** × 10%로 내고, 여기서 매입 공급대가의 0.5%를 뺍니다.","more":"소매업·음식점업은 15%, 제조업·농림어업은 20%, 숙박업 25%, 건설업·운수·창고업·정보통신업 30%, 부동산 관련·전문서비스업 등은 40%입니다. 연 매출 4,800만원 미만이면 납부세액이 없습니다(납부의무 면제). 신규 개업·휴업·폐업은 12개월로 환산해 판단합니다. 왜 부가가치율을 쓰냐면, 간이과세자는 장부가 단순해 실제 부가가치를 계산하기 어렵기 때문입니다. 세금계산서를 발급하는 간이과세자는 상반기 발급분에 대해 7월 25일 예정신고를 해야 합니다.","basis":"「부가가치세법」 제63조(과세표준과 세액), 제69조(납부의무 면제), 같은 법 시행령 제111조(업종별 부가가치율) · [국세청 간이과세 Q&A](https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11937&mi=1329) · 확인 2026-11-28","expert":"업종이 둘 이상이면 부가가치율을 각각 적용해야 하고, 매출이 1억 400만원을 넘으면 일반과세로 전환됩니다. 세무사에게 계산을 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 간이과세 Q&A","u":"https://call.nts.go.kr/call/qna/selectQnaInfo.do?ctgId=CTG11937&mi=1329"}],"basis_text":"「부가가치세법」 제63조(과세표준과 세액), 제69조(납부의무 면제), 같은 법 시행령 제111조(업종별 부가가치율) ·  · 확인 2026-11-28"},{"no":13,"cat":"부가세","q":"신고를 놓치면 어떻게 되나요?","short":"**무신고 20%, 과소신고 10%, 납부지연 하루 0.022%**가 붙습니다. 부정행위가 있으면 40%까지 올라갑니다.","more":"납부지연가산세는 연 8%대(0.022% × 365일)로, 미루는 만큼 계속 늘어납니다. 신고만 먼저 하고 납부를 미루면 무신고가산세는 피하고 납부지연가산세만 붙습니다. 기한 후 신고를 하면 무신고가산세가 1개월 내 50%, 3개월 내 30%, 6개월 내 20%로 줄어드는 경우가 있습니다. 왜 이렇게 매기냐면, 신고·납부를 늦추는 것 자체가 다른 사업자와의 형평을 깨기 때문입니다. 가산세는 세무서가 고지하기 전에 자진 수정신고하는 쪽이 유리합니다.","basis":"「국세기본법」 제47조의2(무신고), 제47조의3(과소신고), 제47조의4(납부지연), 제48조(감면) · [국세청 가산세 안내](https://www.nts.go.kr/gmt/cm/cntnts/cntntsView.do?cntntsId=239059&mi=41010) · 확인 2026-11-28","expert":"이미 무신고 고지서를 받았거나, 부정행위로 40%가 적용될 수 있는 상황이면 혼자 판단하지 마세요. 세무사와 상담해야 감면·이의신청 여부를 가릴 수 있습니다. 정확한 판단은 세무사나 국세청(126)에 확인하세요.","staff":false,"links":[{"t":"국세청 가산세 안내","u":"https://www.nts.go.kr/gmt/cm/cntnts/cntntsView.do?cntntsId=239059&mi=41010"}],"basis_text":"「국세기본법」 제47조의2(무신고), 제47조의3(과소신고), 제47조의4(납부지연), 제48조(감면) ·  · 확인 2026-11-28"},{"no":14,"cat":"부가세","q":"세금계산서를 잘못 끊었어요. 어떻게 하나요?","short":"**착오, 계약 해제·반품, 공급가액 변동** 등이면 수정세금계산서를 발급합니다. 마이너스 세금계산서라고도 부릅니다.","more":"수정 사유에 따라 발급 시기와 작성 방법이 다릅니다. 예를 들어 단순 착오는 발견한 날, 반품은 반품한 날에 발급합니다. 수정세금계산서를 늦게 끊으면 상대방의 신고와 어긋나 양쪽 모두 수정신고를 해야 하는 번거로움이 생깁니다. 왜 수정이 필요하냐면, 세금계산서는 발급한 금액대로 신고되어 실제 거래와 차이가 생기기 때문입니다. 상대방과 발급 사실을 반드시 확인해 주세요.","basis":"「부가가치세법」 제34조, 같은 법 시행령 제70조(수정세금계산서) · [국가법령정보센터](https://www.law.go.kr/법령/부가가치세법시행령/제70조) · 확인 2026-11-28","expert":"이미 상대방이 신고를 끝냈거나, 거래처와 금액 다툼이 있으면 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/부가가치세법시행령/제70조"}],"basis_text":"「부가가치세법」 제34조, 같은 법 시행령 제70조(수정세금계산서) ·  · 확인 2026-11-28"},{"no":15,"cat":"부가세","q":"면세 매출과 과세 매출이 섞여 있어요.","short":"임차료·전기료처럼 **공통으로 쓴 매입세액**은 과세·면세 매출 비율로 나눠 공제합니다.","more":"매출 구분이 명확하면 해당 사업에 직접 쓴 매입만 공제하고, 구분이 안 되면 공급가액 비율로 안분합니다. 연말에 실제 비율로 다시 정산하는 절차가 있습니다. 면세 매출이 늘면 공제받는 매입세액이 줄어 실제 부담이 커집니다. 왜 나누냐면, 면세 사업을 위해 쓴 매입까지 돌려주면 과세·면세 형평이 깨지기 때문입니다. 학원·병원·주택임대처럼 면세 사업을 함께 하는 사업장에서 자주 문제가 됩니다.","basis":"「부가가치세법」 제40조(공통매입세액 안분), 같은 법 시행령 제81조 · [국가법령정보센터](https://www.law.go.kr/법령/부가가치세법/제40조) · 확인 2026-11-28","expert":"면세 매출 비중이 크거나, 겸영 사업장의 건물·차량을 함께 쓰면 안분 계산이 복잡합니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/부가가치세법/제40조"}],"basis_text":"「부가가치세법」 제40조(공통매입세액 안분), 같은 법 시행령 제81조 ·  · 확인 2026-11-28"},{"no":16,"cat":"원천세·급여","q":"직원 월급에서 세금은 어떻게 떼나요?","short":"**근로소득 간이세액표**대로 매월 떼고, 떼어 낸 세금을 **다음 달 10일까지** 신고·납부합니다.","more":"간이세액표는 급여액과 부양가족 수로 세액을 정해 놓은 표입니다. 직원이 원하면 80%·100%·120% 중에서 선택할 수 있습니다. 매월 10일까지 내는 것이 원칙이지만, 규모가 작은 사업자는 반기마다 낼 수 있는 제도가 있습니다(Q22). 원천징수는 회사가 직원 대신 세금을 떼어 나라에 내는 제도라, 떼기만 하고 신고·납부를 안 하면 회사가 가산세를 부담합니다. 왜 매월이냐면, 세금을 한꺼번에 밀리지 않게 하려는 것입니다. 연말에는 2월분 급여를 줄 때 연말정산으로 정산합니다.","basis":"「소득세법」 제127조(원천징수), 제134조, 제129조 · [국세청 원천징수 신고납부기한](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7702&mi=2273) · 확인 2026-11-28","expert":"직원이 입사·퇴사로 중간에 들어오거나, 상여·수당 항목이 많아 과세·비과세 구분이 애매하면 세무사에게 맡기세요. 정확한 판단은 세무사나 국세청(126)에 확인하세요.","staff":false,"links":[{"t":"국세청 원천징수 신고납부기한","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7702&mi=2273"}],"basis_text":"「소득세법」 제127조(원천징수), 제134조, 제129조 ·  · 확인 2026-11-28"},{"no":17,"cat":"원천세·급여","q":"알바를 하루 썼어요. 세금은 어떻게 하나요?","short":"하루 **15만원을 빼고 6%**로 계산한 뒤 **55%를 공제**해 떼고, 다음 달 10일까지 신고합니다. 실질 부담은 (일당 − 15만원) × 2.7%입니다.","more":"예를 들어 일당 20만원이면 (20만 − 15만) × 6% = 3,000원, 여기서 55%를 빼면 1,350원입니다. 여기에 지방소득세 10%를 더합니다. 일당이 15만원 이하면 소득세가 0원이고, 하루 18만 7천원 이하면 1,000원 미만이라 징수하지 않는 경우가 많습니다(소액부징수). 일용근로자는 연말정산 대상이 아니어서, 지급할 때 떼면 납세가 끝납니다. 지급명세서는 지급한 달의 다음 달 말일까지 내야 합니다. 왜 공제를 크게 해 주냐면, 하루 단위로 일하는 사람의 최저 생계를 고려한 것입니다.","basis":"「소득세법」 제47조 제2항(1일 15만원 공제), 제129조 제1항 제4호(6%), 제59조 제3항(55% 공제) · [국세청 일용근로소득 안내](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7863) · 확인 2026-11-28","expert":"같은 사람이 한 달에 여러 번 나오거나, 3개월을 넘겨 계속 일하면 일용근로자가 아닐 수 있습니다(Q23). 판단이 애매하면 노무사·세무사에게 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 일용근로소득 안내","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7863"}],"basis_text":"「소득세법」 제47조 제2항(1일 15만원 공제), 제129조 제1항 제4호(6%), 제59조 제3항(55% 공제) ·  · 확인 2026-11-28"},{"no":18,"cat":"원천세·급여","q":"3.3%로 계약한 사람은 어떻게 신고해요?","short":"사업소득으로 보고 **3%**(지방소득세 포함 3.3%)를 떼어 **다음 달 10일까지** 신고·납부합니다. 간이지급명세서는 다음 달 말일까지입니다.","more":"3.3%는 인적용역(보험설계사·강사·방문판매원 등)에 대한 원천징수입니다. 이 사람이 나중에 5월에 종합소득세를 신고하면, 떼어 간 3.3%는 미리 낸 세금으로 정산됩니다. 계약서에 \"사업소득 3.3% 원천징수\"라고 적어 두면 나중에 다툼이 줄어듭니다. 왜 회사가 떼야 하냐면, 소득을 지급하는 쪽이 세원을 확보하는 책임을 지기 때문입니다. 3.3%를 안 떼고 전액 주면 회사가 원천징수 의무를 어긴 것이 됩니다.","basis":"「소득세법」 제127조, 제129조 제1항 제3호, 제164조의3(간이지급명세서) · [국세청 사업소득 원천징수](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7902&mi=6466) · 확인 2026-11-28","expert":"그 사람이 실제로는 우리 회사 지시를 받고 출퇴근하며 일한다면 근로자로 보아야 할 수 있습니다(Q33). 세무사·노무사에게 근로자성 판단을 맡기세요. 정확한 판단은 세무사나 국세청(126)에 확인하세요.","staff":false,"links":[{"t":"국세청 사업소득 원천징수","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7902&mi=6466"}],"basis_text":"「소득세법」 제127조, 제129조 제1항 제3호, 제164조의3(간이지급명세서) ·  · 확인 2026-11-28"},{"no":19,"cat":"원천세·급여","q":"지급명세서는 언제 내나요?","short":"**근로소득은 다음 해 3월 10일**, **일용근로소득은 지급한 달의 다음 달 말일**, 간이지급명세서(사업소득)는 지급한 달의 다음 달 말일입니다.","more":"근로소득 간이지급명세서는 2026년 지급분까지 반기(7월 말일·다음 해 1월 말일)이고, 2027년 1월 지급분부터 매월로 바뀝니다. 일용근로소득 지급명세서는 매월 내야 합니다. 기한을 넘기면 지급액의 1%(일용·간이 0.25%) 가산세가 붙습니다. 왜 내야 하냐면, 직원의 소득과 4대보험·연말정산 자료가 이 명세서로 맞춰지기 때문입니다. 급여대장만 있고 명세서가 없으면 직원의 소득 증명이 막힙니다.","basis":"「소득세법」 제164조(지급명세서), 제164조의3(간이지급명세서), 제81조의11(가산세) · [국세청 지급명세서 제출 안내](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=8631) · 확인 2026-11-28","expert":"직원이 많거나, 퇴직·중도입사가 잦아 명세서가 자주 어긋나면 세무사에게 정리를 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 지급명세서 제출 안내","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=8631"}],"basis_text":"「소득세법」 제164조(지급명세서), 제164조의3(간이지급명세서), 제81조의11(가산세) ·  · 확인 2026-11-28"},{"no":20,"cat":"원천세·급여","q":"연말정산은 언제 해요?","short":"다음 해 **2월분 급여를 지급할 때** 합니다. 퇴사자는 퇴직하는 달의 급여를 줄 때 합니다.","more":"직원이 제출한 소득·세액공제 자료로 1년치 세금을 다시 계산해, 더 냈으면 돌려주고 덜 냈으면 더 뗍니다. 회사는 결과를 원천징수이행상황신고서에 담아 내고, 근로소득 지급명세서는 3월 10일까지 제출합니다. 직원이 자료를 늦게 내면 회사가 일정을 놓치기 쉬우니, 1월 초에 제출 기한을 공지해 두는 것이 안전합니다. 왜 2월이냐면, 1년치 급여가 확정된 뒤에 정산해야 정확하기 때문입니다.","basis":"「소득세법」 제137조(연말정산), 제140조 · [국세청 연말정산 기한](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7702&mi=2273) · 확인 2026-11-28","expert":"직원이 중도 입사·퇴사했거나, 외국인·일용직에서 전환된 직원이 있으면 정산 방식이 달라집니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 연말정산 기한","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7702&mi=2273"}],"basis_text":"「소득세법」 제137조(연말정산), 제140조 ·  · 확인 2026-11-28"},{"no":21,"cat":"원천세·급여","q":"직원이 그만뒀어요. 퇴직금은 얼마인가요?","short":"**1년 이상** 계속 근로하고 주 15시간 이상이면, 1년에 대해 **30일분 이상의 평균임금**을 퇴직 후 **14일 이내**에 줍니다.","more":"퇴직금은 (1일 평균임금 × 30일 × 총 근속일수) ÷ 365로 계산합니다. 평균임금은 퇴직 전 3개월에 지급된 임금 총액을 그 기간의 총일수로 나눈 금액입니다. 퇴직연금에 가입한 경우에는 적립금으로 정산합니다. 14일 안에 주지 않으면 지연이자가 붙고, 노동청 진정 대상이 됩니다. 왜 1년이냐면, 단기 근로까지 퇴직금 의무를 지우면 소규모 사업장이 감당하기 어렵기 때문입니다. 계약직·아르바이트도 요건을 채우면 똑같이 적용됩니다.","basis":"「근로자퇴직급여 보장법」 제4조(설정), 제8조(30일분), 제9조(14일 이내) · [국가법령정보센터](https://www.law.go.kr/법령/근로자퇴직급여보장법/제8조) · 확인 2026-11-28","expert":"평균임금에 상여·수당을 넣을지, 육아휴직·병가 기간을 어떻게 볼지에 따라 금액이 달라집니다. 노무사에게 계산을 맡기세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로자퇴직급여보장법/제8조"}],"basis_text":"「근로자퇴직급여 보장법」 제4조(설정), 제8조(30일분), 제9조(14일 이내) ·  · 확인 2026-11-28"},{"no":22,"cat":"원천세·급여","q":"원천세를 반기마다 낼 수 있나요?","short":"일정 규모 이하 사업자는 **1월 10일·7월 10일**에 반기로 모아 낼 수 있습니다. 대상 여부는 세무서·홈택스에서 확인합니다.","more":"반기납부 대상이면 1~6월분을 7월 10일, 7~12월분을 다음 해 1월 10일에 냅니다. 매월 신고하는 번거로움은 줄지만, 대상이 아닌데 반기로 내면 무신고·과소신고가 됩니다. 대상 기준(상시근로자 수·직전 원천징수세액 등)은 해마다 조금씩 달라질 수 있어, 홈택스 원천세 신고 화면에서 \"반기납부 대상\" 표시를 확인하는 것이 가장 빠릅니다. 왜 두는 제도냐면, 직원이 적은 사업자의 신고 부담을 줄이려는 것입니다.","basis":"「소득세법」 제128조(반기별 납부) · [국세청 원천징수 신고납부기한](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7702&mi=2273) · 확인 2026-11-28","expert":"반기납부 대상인지, 중간에 직원이 늘어 대상에서 빠지는지 판단이 필요하면 세무사에게 확인하세요. 정확한 판단은 세무사나 국세청(126)에 확인하세요.","staff":false,"links":[{"t":"국세청 원천징수 신고납부기한","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7702&mi=2273"}],"basis_text":"「소득세법」 제128조(반기별 납부) ·  · 확인 2026-11-28"},{"no":23,"cat":"원천세·급여","q":"알바를 3개월 넘게 쓰면 어떻게 되나요?","short":"같은 곳에서 **3개월 이상 계속 고용**되면(건설공사는 1년) 일용근로자가 아니라 **일반 근로자**로 보아 간이세액표·연말정산 대상이 됩니다.","more":"일급·시급으로 줘도 고용 기간이 기준입니다. 처음부터 3개월 이상 일하기로 계약했는데 2개월 만에 그만둔 경우에도 일반 근로자로 봅니다. 일반 근로자가 되면 4대보험·퇴직금·연차·주휴수당 문제가 함께 따라옵니다. 왜 선을 긋냐면, 일용근로자 제도가 반복 고용을 피하는 수단으로 쓰이지 않게 하려는 것입니다. 3개월이 지나면 원천세 신고를 일반 근로소득으로 바꾸고, 4대보험 취득 신고도 챙겨야 합니다.","basis":"「소득세법」 제20조, 같은 법 시행령 제20조(일용근로자 범위) · [국세청 일용근로소득 안내](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7863) · 확인 2026-11-28","expert":"3개월을 넘긴 직원이 여럿이면 4대보험 소급 가입과 원천세 정정이 필요합니다. 세무사·노무사와 함께 정리하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"국세청 일용근로소득 안내","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7863"}],"basis_text":"「소득세법」 제20조, 같은 법 시행령 제20조(일용근로자 범위) ·  · 확인 2026-11-28"},{"no":24,"cat":"원천세·급여","q":"직원에게 현금으로 줬어요. 문제가 되나요?","short":"현금 지급 자체가 불법은 아니지만, **급여대장·원천세 신고·4대보험 신고**가 없으면 비용으로 인정받기 어렵고 과태료 대상이 됩니다.","more":"세무서는 급여 지급 사실을 통장 이체 내역, 원천세 신고, 4대보험 신고로 확인합니다. 셋이 어긋나면 가공 인건비로 의심받기 쉽습니다. 부득이 현금으로 줬다면 직원 서명이 있는 급여 수령 확인서와 급여대장을 남기고, 원천세 신고는 반드시 해야 합니다. 왜 이렇게 까다롭냐면, 현금 급여는 소득과 4대보험에서 빠지기 쉬워 직원의 노후·실업 보호가 끊기기 때문입니다. 비과세 항목(식대 20만원 등)을 섞어 신고하는 것도 위험합니다.","basis":"「소득세법」 제127조(원천징수), 제164조(지급명세서), 「근로기준법」 제48조(임금대장) · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제48조) · 확인 2026-11-28","expert":"이미 몇 달치를 현금으로 지급했고 신고가 없다면, 소급 신고와 가산세를 함께 계산해야 합니다. 세무사에게 먼저 상담하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제48조"}],"basis_text":"「소득세법」 제127조(원천징수), 제164조(지급명세서), 「근로기준법」 제48조(임금대장) ·  · 확인 2026-11-28"},{"no":25,"cat":"4대보험","q":"4대보험 요율이 어떻게 되나요?","short":"2026년 기준 **국민연금 9.5%, 건강보험 7.19%, 장기요양 0.9448%(건강보험료의 13.14%), 고용보험 실업급여 1.8%, 산재보험 업종별(평균 1.47%)**입니다.","more":"국민연금·건강보험·장기요양·고용보험 실업급여는 직원과 사업주가 절반씩 냅니다. 고용보험의 고용안정·직업능력개발 보험료(150인 미만 0.25%)와 산재보험은 사업주가 전액 냅니다. 2026년은 국민연금이 9%에서 9.5%로 오른 첫해이고, 건강보험도 7.09%에서 7.19%로 올랐습니다. 산재보험은 업종마다 크게 달라(건설 35‰, 도소매·음식·숙박 8‰ 등) 사업장 확정 전에는 평균으로만 가늠해야 합니다. 왜 절반씩이냐면, 사회보험은 사용자와 근로자가 함께 부담하는 구조로 설계됐기 때문입니다.","basis":"[4대사회보험 정보연계센터(2026년 기준)](https://www.4insure.or.kr/pbiz/feii/inscIntroView.do), [보건복지부 2026년 건강보험료율 7.19%](https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1487279&mid=a10503000000), [고용노동부 2026년 산재보험료율](https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18810) · 확인 2026-11-28","expert":"사업장의 실제 산재보험 요율, 두 곳 이상 사업장의 보험료 배분, 임금 총액 산정은 공단 확인이 필요합니다. 근로복지공단(1588-0075)·국민건강보험공단(1577-1000)에 문의하세요. 정확한 판단은 해당 공단에 확인하세요.","staff":false,"links":[{"t":"4대사회보험 정보연계센터(2026년 기준)","u":"https://www.4insure.or.kr/pbiz/feii/inscIntroView.do"},{"t":"보건복지부 2026년 건강보험료율 7.19%","u":"https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1487279&mid=a10503000000"},{"t":"고용노동부 2026년 산재보험료율","u":"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=18810"}],"basis_text":", ,  · 확인 2026-11-28"},{"no":26,"cat":"4대보험","q":"알바도 4대보험에 들어야 하나요?","short":"**고용보험은 주 15시간 미만이거나 월 60시간 미만이면 원칙적으로 빠지지만 3개월 이상 계속 일하면 적용**되고, **국민연금·건강보험은 월 60시간 미만이면 원칙적으로 빠집니다.** 산재보험은 항상 적용됩니다.","more":"주 14시간짜리 알바도 석 달을 넘기면 고용보험 취득 신고 대상이 됩니다. 국민연금은 3개월 이상 근무하며 본인이 원하고 사업주가 동의하면 가입할 수 있는 길도 있습니다. 건강보험에서 빠진 직원은 지역가입자나 가족 피부양자가 됩니다. 왜 기준이 제각각이냐면, 네 보험이 각각 다른 법을 따르기 때문입니다. 계약서에 주·월 소정근로시간을 분명히 적어 두어야 나중에 \"실제로는 더 일했다\"는 다툼을 줄일 수 있습니다.","basis":"「고용보험법 시행령」 제3조, 「국민연금법 시행령」 제2조, 「국민건강보험법 시행령」 제9조, 「산업재해보상보험법」 제6조 · [4대보험 정보연계센터](https://www.4insure.or.kr/pbiz/feii/inscIntroView.do) · 확인 2026-11-28","expert":"주 14시간처럼 60시간 경계에 걸치는 계약, 두 곳에서 일하는 직원, 3개월 이상 계속 근무하는 초단시간 직원은 판단이 갈립니다. 국민연금공단(1355)·건강보험공단(1577-1000)에 계약서를 기준으로 확인하세요. 정확한 판단은 각 공단에 확인하세요.","staff":false,"links":[{"t":"4대보험 정보연계센터","u":"https://www.4insure.or.kr/pbiz/feii/inscIntroView.do"}],"basis_text":"「고용보험법 시행령」 제3조, 「국민연금법 시행령」 제2조, 「국민건강보험법 시행령」 제9조, 「산업재해보상보험법」 제6조 ·  · 확인 2026-11-28"},{"no":27,"cat":"4대보험","q":"일용직은 4대보험이 어떻게 되나요?","short":"**고용보험과 산재보험은 적용**되고, 사업주가 매월 **근로내용확인신고서**를 내면 취득·상실 신고를 한 것으로 봅니다. 신고 기한은 **다음 달 15일**입니다.","more":"국민연금·건강보험은 1개월 이상 계속 근로하는지에 따라 갈리는 경우가 많아, 일용직이라도 계속 고용되면 가입 대상이 될 수 있습니다. 근로내용확인신고에는 근로일수와 보수 등을 적습니다. 이 신고를 빠뜨리면 일용직이 실업급여를 받지 못하고, 사업주는 과태료를 부담합니다. 왜 별도 신고를 두냐면, 매일 들어오고 나가는 사람의 취득·상실을 건별로 신고하는 부담을 줄이려는 것입니다. 현장에서 \"며칠 일했는지\"를 매월 정확히 남기는 것이 핵심입니다.","basis":"「고용보험법」 제15조, 같은 법 시행령 제7조 · [고용노동부 일용근로자 고용보험 안내](https://www.moel.go.kr/faq/faqView.do?seqRepeat=218) · 확인 2026-11-28","expert":"한 사람이 한 달에 여러 현장을 돌거나, 일용과 상용을 오가는 경우 가입 기간과 보험료가 복잡해집니다. 근로복지공단(1588-0075)에 확인하세요. 정확한 판단은 근로복지공단에 확인하세요.","staff":false,"links":[{"t":"고용노동부 일용근로자 고용보험 안내","u":"https://www.moel.go.kr/faq/faqView.do?seqRepeat=218"}],"basis_text":"「고용보험법」 제15조, 같은 법 시행령 제7조 ·  · 확인 2026-11-28"},{"no":28,"cat":"4대보험","q":"직원이 들어오면 4대보험 신고는 언제 해요?","short":"**건강보험은 취득일부터 14일 이내**, **국민연금·고용보험·산재보험은 사유가 생긴 달의 다음 달 15일까지**입니다.","more":"실무에서는 4대사회보험 정보연계센터에서 공통 서식으로 네 기관에 한 번에 신고합니다. 건강보험 기한이 가장 짧기 때문에, 입사한 주에 네 가지를 함께 처리하는 것이 안전합니다. 수습 기간이라고 신고를 미룰 수는 없습니다. 자격취득일은 신고일이 아니라 실제 고용된 날입니다. 왜 기한이 다르냐면, 건강보험은 진료비 지급과 바로 연결되어 신고가 늦으면 공단이 손해를 보기 때문입니다. 고용보험은 직원이 먼저 신고를 요구하면 기한을 기다리지 않고 바로 해야 합니다.","basis":"「국민건강보험법」 제8조·제9조, 「국민연금법 시행규칙」 제6조, 「고용보험법 시행령」 제7조 · [4대보험 취득·상실 안내](https://www.4insure.or.kr/pbiz/feii/joinCncltnIntroView.do) · 확인 2026-11-28","expert":"입사일과 실제 근무 시작일이 다르거나, 다른 사업장에서 이중 취득이 걸린 경우 공단 확인이 필요합니다. 4대보험 정보연계센터에서 확인하세요. 정확한 판단은 해당 공단에 확인하세요.","staff":false,"links":[{"t":"4대보험 취득·상실 안내","u":"https://www.4insure.or.kr/pbiz/feii/joinCncltnIntroView.do"}],"basis_text":"「국민건강보험법」 제8조·제9조, 「국민연금법 시행규칙」 제6조, 「고용보험법 시행령」 제7조 ·  · 확인 2026-11-28"},{"no":29,"cat":"4대보험","q":"직원이 나가면 4대보험은 어떻게 하나요?","short":"**상실일은 마지막 근무일의 다음 날**이고, 신고 기한은 취득과 같습니다(건강보험 14일, 나머지 다음 달 15일).","more":"퇴사일을 상실일로 적는 실수가 가장 많습니다. 예를 들어 11월 20일까지 일했다면 상실일은 11월 21일입니다. 상실 사유(자발적 퇴사·계약만료·해고 등)는 실업급여와 사업주 지원금을 가르는 중요한 정보라 정확히 적어야 합니다. 고용보험 상실 신고 때 이직확인서를 함께 내면 직원이 실업급여를 빨리 받을 수 있습니다. 왜 다음 날이냐면, 마지막 근무일까지는 근로관계가 살아 있기 때문입니다.","basis":"「국민건강보험법」 제9조, 「고용보험법」 제14조, 「보험료징수법」 제16조의10 · [4대보험 상실신고 안내](https://www.4insure.or.kr/pbiz/feii/joinCncltnIntroView.do) · 확인 2026-11-28","expert":"권고사직·해고·계약만료 중 무엇으로 적을지 다툼이 있으면 노무사에게 확인하세요. 상실 사유를 잘못 적으면 직원의 실업급여가 막힙니다. 정확한 판단은 근로복지공단에 확인하세요.","staff":false,"links":[{"t":"4대보험 상실신고 안내","u":"https://www.4insure.or.kr/pbiz/feii/joinCncltnIntroView.do"}],"basis_text":"「국민건강보험법」 제9조, 「고용보험법」 제14조, 「보험료징수법」 제16조의10 ·  · 확인 2026-11-28"},{"no":30,"cat":"4대보험","q":"두루누리 지원을 받을 수 있나요?","short":"**근로자 10명 미만** 사업장에서 **월 평균보수 270만원 미만**인 신규 가입 직원과 사업주에게 국민연금·고용보험료의 **80%**를 **최대 36개월** 지원합니다.","more":"\"신규 가입자\"는 신청일 전 1년간 국민연금·고용보험 가입 이력이 없는 사람입니다. 이미 다니던 직원은 2021년부터 지원이 끝났습니다. 대표자 본인 보험료는 지원 대상이 아닙니다. 2026년 월 지원 한도는 국민연금 근로자·사업주 각 87,400원, 고용보험 근로자 16,560원·사업주 21,160원입니다. 전년도 재산세 과세표준 6억원 이상이거나 종합소득 4,300만원 이상이면 빠집니다. 왜 지원하냐면, 영세 사업장이 보험료 부담 때문에 직원을 4대보험 밖에 두는 것을 막으려는 것입니다. 신청은 근로복지공단·국민연금공단에서 합니다.","basis":"「국민연금법」 제100조의3, 「보험료징수법」 제21조, 2026년 두루누리 운영지침, 보건복지부 고시(연금보험료 월 최대 87,400원) · [4대보험 두루누리 안내](https://www.4insure.or.kr/ptl/totalinfo/tab02/page01.html) · 확인 2026-11-28","expert":"사업장 규모가 10명 경계에 있거나, 가족을 직원으로 등록한 경우 대상 판정이 갈립니다. 근로복지공단(1588-0075)·국민연금공단(1355)에 확인하세요. 정확한 판단은 해당 공단에 확인하세요.","staff":false,"links":[{"t":"4대보험 두루누리 안내","u":"https://www.4insure.or.kr/ptl/totalinfo/tab02/page01.html"}],"basis_text":"「국민연금법」 제100조의3, 「보험료징수법」 제21조, 2026년 두루누리 운영지침, 보건복지부 고시(연금보험료 월 최대 87,400원) ·  · 확인 2026-11-28"},{"no":31,"cat":"4대보험","q":"보수총액 신고는 언제 하나요?","short":"매년 **3월 15일까지** 전년도 근로자 보수총액을 근로복지공단에 신고합니다. 건설업·벌목업은 3월 31일까지 확정보험료·개산보험료를 신고·납부합니다.","more":"보수총액은 고용·산재보험료를 정산하는 기준입니다. 신고를 빠뜨리면 공단이 추정해 고지하고, 나중에 정산 과정에서 추가 부담이 생깁니다. 매월 보험료는 다음 달 10일까지 내는 것이 원칙입니다. 왜 따로 신고하냐면, 월별로 낸 보험료와 실제 연간 보수가 맞는지 정산해야 하기 때문입니다. 직원이 입·퇴사로 자주 바뀌면 급여대장과 4대보험 자료를 월별로 맞춰 두는 것이 좋습니다.","basis":"「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」 제19조 · [고용보험 안내(2026년 2월 기준)](https://moel.go.kr/common/downloadFile.do?bbs_id=23&bbs_seq=20260200945&file_ext=pdf&file_seq=20260201644) · 확인 2026-11-28","expert":"보수총액에 상여·수당·비과세 항목을 어떻게 넣을지, 퇴직자 보수를 포함할지 판단이 필요합니다. 근로복지공단에 확인하세요. 정확한 판단은 근로복지공단에 확인하세요.","staff":false,"links":[{"t":"고용보험 안내(2026년 2월 기준)","u":"https://moel.go.kr/common/downloadFile.do?bbs_id=23&bbs_seq=20260200945&file_ext=pdf&file_seq=20260201644"}],"basis_text":"「고용보험 및 산업재해보상보험의 보험료징수 등에 관한 법률」 제19조 ·  · 확인 2026-11-28"},{"no":32,"cat":"4대보험","q":"4대보험 신고를 안 하면 어떻게 되나요?","short":"**과태료**(미신고는 피보험자 1명당 3만원·최대 100만원, 거짓 신고는 1명당 최대 10만원·최대 300만원)가 붙고, **보험료를 소급해 추징**당하는 경우가 많습니다.","more":"직원이 직접 공단에 피보험자격 확인을 청구할 수 있어, 나중에 드러나는 경우가 많습니다. 소급 가입되면 회사 부담분과 직원 부담분을 함께 정산해야 하고, 그 사이 직원이 다치면 산재 처리도 복잡해집니다. 고용보험료를 체납하면 각종 지원금·장려금 신청이 제한될 수 있습니다. 왜 강하게 제재하냐면, 4대보험이 직원의 치료·실업·노후를 담보하는 최소한의 안전망이기 때문입니다.","basis":"「고용보험법」 제118조(과태료) · [고용24 피보험자격 관리 안내](https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systId=SI00000408) · 확인 2026-11-28","expert":"이미 미신고 기간이 길거나, 직원이 진정을 넣은 상태라면 혼자 정리하지 마세요. 노무사·세무사와 함께 소급 신고와 과태료 감면 여부를 확인해야 합니다. 정확한 판단은 근로복지공단이나 노무사에 확인하세요.","staff":false,"links":[{"t":"고용24 피보험자격 관리 안내","u":"https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systId=SI00000408"}],"basis_text":"「고용보험법」 제118조(과태료) ·  · 확인 2026-11-28"},{"no":33,"cat":"인력·도급 사업","q":"도급과 근로는 뭐가 달라요?","short":"**일을 맡기고 결과를 받으면 도급**, **시간·장소·방법을 지시받으며 일하면 근로**입니다. 계약서 제목이 아니라 실제 일하는 모습으로 판단합니다.","more":"법원과 노동부는 ① 업무 거부가 가능한지 ② 출퇴근 시간·장소에 구속되는지 ③ 구체적 지시를 받는지 ④ 대신 다른 사람을 보낼 수 있는지 ⑤ 보수가 시간·일당인지 성과인지 등을 종합해 봅니다. 도급계약서를 썼어도 실제로는 회사가 출퇴근을 관리하고 일을 지시했다면 근로자로 인정될 수 있습니다. 근로자로 인정되면 4대보험·퇴직금·연차·최저임금이 소급 적용되고, 세무상으로도 급여·원천세 문제가 생깁니다. 왜 이 구분이 중요하냐면, 두 제도의 책임 범위가 완전히 다르기 때문입니다.","basis":"「근로기준법」 제2조 제1항 제1호(근로자 정의), 대법원의 근로자성 판단 기준 · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제2조) · 확인 2026-11-28","expert":"현장에서 도급인데 우리 직원이 출퇴근·작업 순서를 지시하는 경우가 흔합니다. 노무사에게 근로자성 판단을 맡기고, 계약서와 실제 운영을 맞추세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제2조"}],"basis_text":"「근로기준법」 제2조 제1항 제1호(근로자 정의), 대법원의 근로자성 판단 기준 ·  · 확인 2026-11-28"},{"no":34,"cat":"인력·도급 사업","q":"원청에서 받은 인건비는 매출인가요?","short":"**우리 매출**로 잡고, 그 돈으로 직원에게 준 급여는 **비용**으로 잡습니다. 받은 돈과 준 돈을 상계해 차액만 매출로 잡으면 안 됩니다.","more":"원청이 인건비를 별도 항목으로 정산해 주더라도, 우리가 용역을 제공하고 받은 대가는 매출입니다. 부가세 신고에서도 매출 전액이 과세표준이 됩니다. 원청에서 받은 인건비는 **정산용 계좌**에 따로 두고 운영비와 섞지 않는 것이 안전합니다. 그래야 \"직원에게 줄 돈이 남았는지\"가 통장에서 바로 보입니다. 왜 상계하면 안 되냐면, 매출이 줄어든 만큼 부가세와 소득세 신고가 실제와 달라지고, 원청 자료와 대사할 때 바로 드러나기 때문입니다.","basis":"「부가가치세법」 제29조(과세표준), 「소득세법」 제19조(사업소득) · [국세청 부가세 개요](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7694&mi=2272) · 확인 2026-11-28","expert":"원청과의 계약이 \"인건비 실비 정산\"인지 \"용역 대가\"인지에 따라 세금계산서 발행 방식이 달라질 수 있습니다. 계약서를 가지고 세무사에게 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 부가세 개요","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7694&mi=2272"}],"basis_text":"「부가가치세법」 제29조(과세표준), 「소득세법」 제19조(사업소득) ·  · 확인 2026-11-28"},{"no":35,"cat":"인력·도급 사업","q":"용역비와 인건비는 어떻게 구분해요?","short":"그 사람이 **근로자면 급여(인건비)**, **독립한 사업자면 용역비**입니다. 이름만 3.3%로 바꿔서 해결되는 문제가 아닙니다.","more":"근로자에게는 급여를 주고 원천세·4대보험·퇴직금이 따라붙습니다. 사업자에게는 세금계산서(또는 3.3% 원천징수)로 지급하고, 그 사람이 자기 비용을 스스로 부담합니다. 같은 사람에게 매달 같은 금액을 고정적으로 주면서 회사가 근무시간을 정하면, 용역이 아니라 근로로 보일 가능성이 큽니다. 왜 엄격하냐면, 용역으로 돌리면 4대보험과 퇴직금을 피할 수 있어 직원 보호가 무너지기 때문입니다. 계약서·세금계산서·실제 근무 방식이 일치해야 합니다.","basis":"「소득세법」 제19조·제20조, 「근로기준법」 제2조 · [국세청 사업소득 안내](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7902&mi=6466) · 확인 2026-11-28","expert":"한 사람에게 용역과 근로가 섞여 있거나, 프리랜서가 사실상 전일제로 일하면 판단이 어렵습니다. 노무사·세무사에게 함께 확인하세요. 정확한 판단은 노무사에 확인하세요.","staff":false,"links":[{"t":"국세청 사업소득 안내","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7902&mi=6466"}],"basis_text":"「소득세법」 제19조·제20조, 「근로기준법」 제2조 ·  · 확인 2026-11-28"},{"no":36,"cat":"인력·도급 사업","q":"하도급 대금은 언제까지 줘야 해요?","short":"물건·공사를 받은 날부터 **60일 안**에, 원청에서 준공금·기성금을 받았으면 **받은 날부터 15일 안**에 줘야 합니다. 늦으면 연 15.5%의 지연이자가 붙습니다.","more":"지급기일을 정하지 않았으면 받은 날이 지급기일이 되고, 60일을 넘겨 정했으면 60일째가 지급기일로 봅니다. \"원청이 돈을 안 줬다\"는 사정은 지급 기한을 늦추는 이유가 되지 않습니다. 건설공사는 건설산업기본법도 15일 지급을 정하고 있습니다. 왜 엄격하냐면, 하도급 대금이 밀리면 그 아래 임금 체불로 이어지기 때문입니다. 지급 증빙(이체 내역·세금계산서)을 남겨 두세요.","basis":"「하도급거래 공정화에 관한 법률」 제13조(지급기일), 「건설산업기본법」 제34조 · [국가법령정보센터](https://law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1030757609) · 확인 2026-11-28","expert":"지급기일을 60일 넘게 정한 특약이 있거나, 검사·인수 시점이 다투어지면 법률 검토가 필요합니다. 변호사·공정거래위원회 상담을 이용하세요. 정확한 판단은 변호사나 공정거래위원회에 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1030757609"}],"basis_text":"「하도급거래 공정화에 관한 법률」 제13조(지급기일), 「건설산업기본법」 제34조 ·  · 확인 2026-11-28"},{"no":37,"cat":"인력·도급 사업","q":"원청이 돈을 안 줘서 하청에 못 줘요. 방법이 있나요?","short":"요건을 갖추면 **하청이 발주처(원청)에 직접 지급을 요청**할 수 있습니다. 2회분 이상 미지급, 원청의 지급정지·파산, 지급보증 미이행 등이 사유입니다.","more":"직접 지급 요청은 하청(수급사업자) **본인 명의**로 발주처에 도달해야 효력이 생깁니다. 원청이 대신 보내면 효력이 다툼 대상이 됩니다. 건설공사는 건설산업기본법 제35조, 제조·용역 하도급은 하도급법 제14조가 근거입니다. 요청서에는 계약서, 기성 확인서, 미지급 내역을 붙입니다. 왜 이 권리를 두냐면, 원청이 중간에서 돈을 막아도 실제로 일한 사람이 대금을 받을 길을 열어 두려는 것입니다. 지급되면 그 범위에서 원청의 우리에 대한 채무도 소멸합니다.","basis":"「하도급거래 공정화에 관한 법률」 제14조, 「건설산업기본법」 제35조 · [국가법령정보센터](https://www.law.go.kr/법령/건설산업기본법/제35조) · 확인 2026-11-28","expert":"직접 지급 요청은 한 번 보내면 되돌리기 어렵고, 원청과의 관계에도 영향을 줍니다. 보내기 전에 변호사와 내용증명 문구를 확인하세요. 정확한 판단은 변호사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/건설산업기본법/제35조"}],"basis_text":"「하도급거래 공정화에 관한 법률」 제14조, 「건설산업기본법」 제35조 ·  · 확인 2026-11-28"},{"no":38,"cat":"인력·도급 사업","q":"노무비를 따로 적어야 하나요?","short":"건설공사 도급에서는 **노무비를 재료비·경비와 구분해 적는 것이 안전**합니다. 공공공사는 노무비 구분 기재·지급 요건이 따로 있습니다.","more":"계약서에 노무비가 구분되어 있으면, 임금 체불이 생겼을 때 \"이 돈은 인건비였다\"는 것을 증명하기 쉽고 발주처의 직접 지급 판단에도 도움이 됩니다. 세무상으로도 인건비와 외주비를 나눠 두면 원가 구조가 보이고, 부가세·원천세 신고가 어긋나지 않습니다. 민간공사에서 노무비 구분 기재를 어디까지 요구하는지는 계약 조건과 발주처 기준에 따라 다릅니다. 왜 구분하냐면, 인건비가 재료비에 섞이면 실제로 일한 사람에게 돈이 갔는지 확인할 수 없기 때문입니다.","basis":"「건설산업기본법」 제34조(하도급대금 지급), 「하도급거래 공정화에 관한 법률」 제13조 · [국가법령정보센터](https://www.law.go.kr/법령/건설산업기본법/제34조) · 확인 2026-11-28 (노무비 구분 계상의 구체 요건은 7번 확인 필요 목록 참조)","expert":"공공발주 공사에 참여하거나 원청이 노무비 전용 계좌를 요구하면 요건이 따로 있습니다. 발주처·전문가에게 확인하세요. 정확한 판단은 세무사나 건설 관련 전문가에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/건설산업기본법/제34조"}],"basis_text":"「건설산업기본법」 제34조(하도급대금 지급), 「하도급거래 공정화에 관한 법률」 제13조 ·  · 확인 2026-11-28 (노무비 구분 계상의 구체 요건은 7번 확인 필요 목록 참조)"},{"no":39,"cat":"장부·비용","q":"어떤 영수증이 경비로 인정되나요?","short":"**세금계산서·계산서·신용카드매출전표·현금영수증**이 적격증빙입니다. 3만원을 넘는 지출이면 이 중 하나가 있어야 경비로 인정됩니다.","more":"3만원 이하라도 간이영수증·영수증이 있으면 인정되는 경우가 있지만, 상호·날짜·금액이 확인되어야 합니다. 상품권·선물 구입, 거래처 식사는 증빙이 특히 중요합니다. 카드전표는 사업용 카드로 결제해야 하고, 사업과 무관한 용도로 쓰면 경비가 아닙니다. 왜 요구하냐면, 매출과 비용이 실제 거래로 확인되어야 소득금액을 정확히 계산할 수 있기 때문입니다. 증빙을 못 받은 지출이 많으면 Q46의 가산세가 붙습니다.","basis":"「소득세법」 제160조의2(증명서류의 수취·보관), 같은 법 시행령 제208조의2 · [국가법령정보센터](https://www.law.go.kr/법령/소득세법/제160조의2) · 확인 2026-11-28","expert":"농수산물 직거래, 중고 거래, 해외 결제처럼 적격증빙을 받기 어려운 지출은 별도 증빙 방법이 있습니다. 세무사에게 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/소득세법/제160조의2"}],"basis_text":"「소득세법」 제160조의2(증명서류의 수취·보관), 같은 법 시행령 제208조의2 ·  · 확인 2026-11-28"},{"no":40,"cat":"장부·비용","q":"경비로 안 되는 게 있나요?","short":"**사업과 직접 관련 없는 지출, 증빙이 없는 지출, 대표 개인 생활비, 벌금·과태료, 대표 본인 급여**는 경비가 되지 않습니다.","more":"사업용 카드로 결제했어도 가족 생활용품·개인 보험·개인 차량 유지비는 경비가 아닙니다. 접대비는 한도 안에서만, 차량은 업무용승용차 규정 안에서만 인정됩니다. 경비를 부풀리면 소득세가 줄어 보이지만, 조사에서 부인되면 본세에 가산세가 붙습니다. 왜 엄격하냐면, 개인 소비를 비용으로 돌리면 사업소득에 대한 과세가 무너지기 때문입니다. 경비 처리한 항목은 \"무엇에, 왜 썼는지\"를 한 줄이라도 남겨 두세요.","basis":"「소득세법」 제27조(필요경비), 제33조(불산입), 제35조(기업업무추진비) · [국가법령정보센터](https://www.law.go.kr/법령/소득세법/제27조) · 확인 2026-11-28","expert":"집과 사업장을 함께 쓰거나, 차량을 가족과 함께 쓰면 안분 계산이 필요합니다. 세무사에게 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/소득세법/제27조"}],"basis_text":"「소득세법」 제27조(필요경비), 제33조(불산입), 제35조(기업업무추진비) ·  · 확인 2026-11-28"},{"no":41,"cat":"장부·비용","q":"차 비용은 얼마까지 경비가 되나요?","short":"업무용 승용차는 **운행기록부가 없으면 1대당 연 1,500만원까지만** 업무사용으로 인정되고, 감가상각비는 연 800만원 한도입니다.","more":"운행기록부를 쓰면 실제 업무 주행 비율만큼 인정됩니다. 법인은 업무전용자동차보험 가입이 사실상 필수이고, 개인사업자는 1대까지 보험 없이도 인정됩니다. 경차·9인승 이상 승합차·화물차는 이 규정 대상이 아닙니다. 주유비·보험료·수리비·자동차세가 모두 관련비용에 들어갑니다. 왜 제한하냐면, 회사 차를 개인적으로 쓰면서 비용만 회사로 넘기는 것을 막으려는 것입니다. 차를 바꿀 때는 취득가액과 업무 사용 비율을 함께 보세요.","basis":"「소득세법」 제33조의2, 같은 법 시행령 제78조의3 · [국가법령정보센터](https://www.law.go.kr/LSW/lsLawLinkInfo.do?chrClsCd=010202&lsJoLnkSeq=1000316871) · 확인 2026-11-28","expert":"차를 리스·렌트로 쓰거나, 업무와 가족용 사용이 섞여 있으면 인정 비율 계산이 복잡합니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/LSW/lsLawLinkInfo.do?chrClsCd=010202&lsJoLnkSeq=1000316871"}],"basis_text":"「소득세법」 제33조의2, 같은 법 시행령 제78조의3 ·  · 확인 2026-11-28"},{"no":42,"cat":"장부·비용","q":"접대비는 얼마까지 인정되나요?","short":"**기본한도 연 1,200만원(중소기업 3,600만원)**에 **매출의 0.3%**를 더한 금액까지입니다. 한 번에 3만원을 넘으면 카드·세금계산서가 필요합니다.","more":"경조금은 20만원까지 증빙 없이 인정되는 경우가 있고, 그를 넘으면 비용이 되지 않습니다. 직원 회식·직원 경조사는 접대비가 아니라 복리후생비로 처리합니다. 문화비·전통시장 지출은 한도의 20% 범위에서 추가로 인정되는 특례가 있습니다. 왜 한도를 두냐면, 접대비는 업무 관련성을 객관적으로 확인하기 어려워 무한정 인정하면 탈세 통로가 되기 때문입니다. 한도를 넘은 금액은 장부에 있어도 세금 계산에서 빠집니다.","basis":"「소득세법」 제35조, 같은 법 시행령 제83조 · [국세청 기업업무추진비 조정명세서 서식](https://www.law.go.kr/LSW/flDownload.do?flSeq=164463555) · 확인 2026-11-28","expert":"매출이 크거나 거래처 접대가 잦으면 한도 계산과 증빙 점검이 필요합니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 기업업무추진비 조정명세서 서식","u":"https://www.law.go.kr/LSW/flDownload.do?flSeq=164463555"}],"basis_text":"「소득세법」 제35조, 같은 법 시행령 제83조 ·  · 확인 2026-11-28"},{"no":43,"cat":"장부·비용","q":"직원 식대는 비과세인가요?","short":"**식사를 따로 제공하지 않는 직원**에게 월 **20만원까지** 비과세입니다. 구내식당·도시락을 주면서 현금 식대를 또 주면 그 현금은 과세입니다.","more":"사내급식이나 이와 비슷한 방법으로 식사를 제공하면 그 식사 자체가 비과세입니다. 현금 식대는 급여규정이나 근로계약서에 지급 기준이 있어야 비과세 근거가 탄탄합니다. 관행으로 매달 20만원을 \"식대\"로 주는 것은 나중에 과세로 돌아갈 수 있습니다. 왜 한 번만 인정하냐면, 같은 식사에 대해 두 번 비과세를 주지 않으려는 것입니다. 4대보험 보수 산정에서도 비과세 식대는 빠집니다.","basis":"「소득세법」 제12조 제3호 러목, 같은 법 시행령 제17조의2 · [국가법령정보센터](https://www.law.go.kr/법령/소득세법/제12조) · 확인 2026-11-28","expert":"일부 직원만 도시락을 받거나, 식권·법인카드 식사 지원을 병행하면 비과세 판단이 갈립니다. 세무사에게 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/소득세법/제12조"}],"basis_text":"「소득세법」 제12조 제3호 러목, 같은 법 시행령 제17조의2 ·  · 확인 2026-11-28"},{"no":44,"cat":"장부·비용","q":"장부를 안 쓰면 어떻게 되나요?","short":"**무기장 가산세**가 붙고, 경비를 실제로 쓴 만큼 인정받지 못해 **세금이 늘어납니다**.","more":"장부가 없으면 기준경비율·단순경비율로 추정해 소득을 계산합니다. 실제보다 소득이 높게 잡히거나, 반대로 경비를 못 받아 세금이 커집니다. 무기장 가산세는 산출세액 × (무기장 소득금액 ÷ 종합소득금액) × 20%로 계산되는 경우가 많습니다. 왜 장부를 요구하냐면, 신고가 실제 사업 성과와 맞는지 확인할 근거가 필요하기 때문입니다. 매출·매입·인건비를 월별로 간단히라도 남기면 세무사 비용과 세금 모두 줄어듭니다.","basis":"「소득세법」 제81조(장부의 기록·보관 불성실 가산세) · [국세청 가산세 안내](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7668&mi=2228) · 확인 2026-11-28","expert":"이미 몇 년치 장부가 없으면 기장 의무·경비율 적용이 복잡합니다. 세무사와 함께 과거분 정리 방향을 잡으세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 가산세 안내","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7668&mi=2228"}],"basis_text":"「소득세법」 제81조(장부의 기록·보관 불성실 가산세) ·  · 확인 2026-11-28"},{"no":45,"cat":"장부·비용","q":"간편장부와 복식부기는 어떻게 갈리나요?","short":"**직전 연도 수입금액**이 업종별 기준(**3억원·1억 5천만원·7,500만원**)에 못 미치면 간편장부, 넘으면 복식부기 의무자입니다.","more":"도소매·부동산매매 등은 3억원, 제조·음식점·건설·운수·정보통신 등은 1억 5천만원, 부동산임대·전문서비스·교육·보건 등은 7,500만원입니다. 신규 개업자는 그해 간편장부 대상입니다. 복식부기 의무자가 되면 사업용 계좌 신고(Q5)와 업무용승용차 명세서 등 추가 의무가 붙습니다. 왜 나누냐면, 거래 규모가 큰 사업자는 장부로 정확히 확인할 필요가 크기 때문입니다. 간편장부도 \"안 쓰는 것\"과는 다릅니다.","basis":"「소득세법」 제160조, 같은 법 시행령 제208조 제5항 · [국가법령정보센터](https://www.law.go.kr/법령/소득세법시행령/제208조) · 확인 2026-11-28","expert":"업종을 겸업하면 수입금액을 환산해 판단해야 해서 계산이 복잡합니다. 세무사에게 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/소득세법시행령/제208조"}],"basis_text":"「소득세법」 제160조, 같은 법 시행령 제208조 제5항 ·  · 확인 2026-11-28"},{"no":46,"cat":"장부·비용","q":"증빙을 못 받은 지출이 많아요.","short":"그 지출은 **경비로 인정되기 어렵고**, 증빙 미수취 금액의 **2% 가산세**가 붙습니다.","more":"3만원 넘는 지출을 현금으로 하고 영수증을 못 받았다면, 나중에 거래처에 요청해도 소급 발급이 안 되는 경우가 많습니다. 카드·현금영수증으로 결제하는 습관이 가장 확실한 예방입니다. 부득이한 지출은 거래처·날짜·품목·금액이 적힌 간이영수증이라도 모아 두세요. 왜 2%를 매기냐면, 증빙 없이 비용을 늘리는 것을 막기 위해서입니다. 세금계산서를 받아야 할 거래를 놓치면 부가세 공제도 함께 잃습니다.","basis":"「소득세법」 제81조 제3항(증명서류 수취 불성실 가산세) · [국세청 가산세 안내](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7668&mi=2228) · 확인 2026-11-28","expert":"증빙이 없는 지출이 큰 비중을 차지하면, 경비율 방식으로 신고하는 것이 나은지 비교가 필요합니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 가산세 안내","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7668&mi=2228"}],"basis_text":"「소득세법」 제81조 제3항(증명서류 수취 불성실 가산세) ·  · 확인 2026-11-28"},{"no":47,"cat":"식당·매장 (같은 자료를 쓰는 일반 개인업체)","q":"홀·주방 알바도 주휴수당을 줘야 하나요?","short":"**4주 평균 주 15시간 미만**이면 주휴수당·연차·퇴직금이 적용되지 않고, **15시간 이상이면 줘야 합니다.** 4대보험은 또 다른 기준(월 60시간)으로 갈립니다.","more":"주 14시간 계약이면 주휴수당은 없지만, 실제로 매주 더 일하게 했다면 소정근로시간이 바뀐 것으로 보아 나중에 밀린 주휴수당을 청구당할 수 있습니다. 최저임금·근로계약서 작성·임금명세서 교부·산재보험은 시간과 관계없이 적용됩니다. 고용보험은 주 15시간 미만이어도 **3개월 이상 계속 일하면** 적용됩니다. 왜 기준이 두 개냐면, 근로기준법은 15시간, 4대보험 법령은 60시간을 쓰기 때문입니다. 홀·주방을 나눠 아주 짧게 쓰는 가게일수록 계약서에 시간을 분명히 적어야 합니다.","basis":"「근로기준법」 제18조 제3항, 제55조, 제60조 / 「근로자퇴직급여 보장법」 제4조 / 「고용보험법 시행령」 제3조 · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제18조) · 확인 2026-11-28","expert":"알바가 실제로는 15시간을 넘겨 일했거나, 3개월을 넘겨 계속 근무했다면 소급 정산 문제가 생깁니다. 노무사에게 확인하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제18조"}],"basis_text":"「근로기준법」 제18조 제3항, 제55조, 제60조 / 「근로자퇴직급여 보장법」 제4조 / 「고용보험법 시행령」 제3조 ·  · 확인 2026-11-28"},{"no":48,"cat":"식당·매장 (같은 자료를 쓰는 일반 개인업체)","q":"카드·배달앱 매출은 부가세 신고를 어떻게 해요?","short":"**손님이 결제한 총액이 매출**입니다. 카드 단말기 매출과 배달앱 신고자료의 매출을 합쳐 신고하고, **수수료는 매입**으로 따로 잡습니다.","more":"매장 카드 매출은 홈택스 카드 조회에 잡히고, 배달앱 결제분은 앱 사장님 사이트의 \"부가세 신고자료\"에서 내려받습니다. 배달앱 카드 결제는 앱 회사 명의로 결제되어 홈택스에 안 나오는 경우가 많아, 앱 자료를 따로 챙겨야 합니다. \"만나서 결제\"로 우리 단말기에 찍힌 금액은 홈택스와 겹치므로 한 번만 넣습니다. 왜 총액이냐면, 부가세는 손님이 낸 대금 전체에 붙는 세금이기 때문입니다. 매출을 정산금으로 줄여 신고하면 플랫폼 자료와 대사되어 매출 누락으로 드러납니다.","basis":"「부가가치세법」 제29조(과세표준), 제46조(카드 세액공제) · [국세청 부가세 신고 안내](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7802&mi=2225) · 확인 2026-11-28","expert":"배달앱이 여러 개거나, 배달팁·쿠폰·할인 부담 주체가 섞여 있으면 매출 배분이 복잡합니다. 세무사에게 앱별 정산자료를 보여 주고 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 부가세 신고 안내","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7802&mi=2225"}],"basis_text":"「부가가치세법」 제29조(과세표준), 제46조(카드 세액공제) ·  · 확인 2026-11-28"},{"no":49,"cat":"식당·매장 (같은 자료를 쓰는 일반 개인업체)","q":"배달앱 정산금만 통장에 들어와요. 그걸 매출로 하면 안 되나요?","short":"**안 됩니다.** 정산금은 매출에서 수수료·배달비·광고비를 뺀 금액이라, 그대로 신고하면 **매출이 빠지고 수수료 공제도 못 받습니다.**","more":"예를 들어 손님 결제가 200만원, 수수료·배달비·광고비가 50만원이면 통장에는 150만원이 들어옵니다. 매출은 200만원으로 잡고, 50만원은 매입(비용)으로 잡아 수수료 세금계산서의 부가세를 공제받습니다. 수수료 세금계산서가 주민번호로 발행됐다면 사업자번호로 재발급을 요청하세요. 배달앱은 결제 자료를 국세청에 제출하므로, 정산금 기준으로 신고하면 바로 차이가 드러납니다. 왜 이렇게 하냐면, 정산 방식은 돈을 받는 방법일 뿐 매출 금액을 바꾸지 않기 때문입니다.","basis":"「부가가치세법」 제29조 제1항·제3항(공급가액), 제29조 제6항(지급 장려금 공제 불가), 제15조·제16조(공급시기) · [국세청 부가세 개요](https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7694&mi=2272) · 확인 2026-11-28","expert":"앱마다 신고자료 형식과 할인 처리 방식이 달라, 처음 신고할 때는 세무사와 한 번 맞춰 두는 것이 좋습니다. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 부가세 개요","u":"https://www.nts.go.kr/nts/cm/cntnts/cntntsView.do?cntntsId=7694&mi=2272"}],"basis_text":"「부가가치세법」 제29조 제1항·제3항(공급가액), 제29조 제6항(지급 장려금 공제 불가), 제15조·제16조(공급시기) ·  · 확인 2026-11-28"},{"no":50,"cat":"식당·매장 (같은 자료를 쓰는 일반 개인업체)","q":"시장에서 식자재를 현금으로 샀어요. 경비로 인정되나요?","short":"**현금영수증·계산서·세금계산서**가 있어야 경비로 인정되고, 일반과세 음식점이면 **의제매입세액공제**도 받을 수 있습니다.","more":"쌀·채소·고기·생선처럼 부가세가 면제된 농축수산물을 사면, 개인 일반과세 음식점은 매입가액의 **8/108**(과세표준 2억원 이하면 **9/109**, 2026년 12월 31일까지)을 매입세액으로 인정받습니다. 한도는 과세표준의 75%·70%·60%입니다. 증빙은 매입처별 계산서합계표, 카드·현금영수증 수령명세서, 매입자발행계산서 중 하나가 필요합니다. 시장에서 영수증 없이 산 재료는 이 공제를 받기 어렵습니다. 간이과세자는 의제매입세액공제 대상이 아닙니다. 2026년 8월 정부 세제개편안에 우대 공제율 연장안이 담겼지만 국회 심의 중이라 확정은 아닙니다.","basis":"「부가가치세법」 제42조(의제매입세액), 같은 법 시행령 제84조(공제율·한도·증빙) · [국가법령정보센터](https://www.law.go.kr/법령/부가가치세법/제42조) · 확인 2026-11-28","expert":"면세·과세 재료가 섞여 있거나, 매입 한도에 걸리는 규모면 공제액 계산이 달라집니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/부가가치세법/제42조"}],"basis_text":"「부가가치세법」 제42조(의제매입세액), 같은 법 시행령 제84조(공제율·한도·증빙) ·  · 확인 2026-11-28"},{"no":51,"cat":"식당·매장 (같은 자료를 쓰는 일반 개인업체)","q":"가게를 접으면 남은 재고와 권리금은 어떻게 되나요?","short":"남은 **재고·비품은 잔존재화**로 보아 폐업 부가세 신고 때 과세되고, **권리금은 사업을 통째로 넘기는지에 따라** 처리가 달라집니다.","more":"재고는 폐업 시점의 시가, 비품·차량 등은 취득가액에서 보유기간 감가율을 적용한 금액이 과세표준입니다. 매입세액을 공제받지 않은 자산은 대상에서 빠지는 경우가 있습니다. 폐업 신고는 사업자등록 폐업 신고와 부가세 신고(폐업한 달의 다음 달 25일)를 모두 해야 합니다. 권리금·시설·재고를 포함해 사업 전체를 포괄적으로 넘기고 요건을 갖추면 부가세 과세 대상이 아닌 사업 양도로 볼 여지가 있고, 개별 자산을 따로 파는 형태면 과세될 수 있습니다. 왜 다른가 하냐면, 사업의 동일성을 유지해 넘기는지가 기준이기 때문입니다.","basis":"「부가가치세법」 제10조(재화 공급의 특례), 제67조(폐업 신고) · [국세청 휴업·폐업 안내](https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2448&nttSn=1393) · 확인 2026-11-28 (권리금의 부가세 처리는 7번 확인 필요 목록 참조)","expert":"권리금 계약, 포괄양수도 요건, 남은 재고 규모가 크면 폐업 전에 세무사와 순서를 정해야 합니다. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국세청 휴업·폐업 안내","u":"https://www.nts.go.kr/nts/na/ntt/selectNttInfo.do?mi=2448&nttSn=1393"}],"basis_text":"「부가가치세법」 제10조(재화 공급의 특례), 제67조(폐업 신고) ·  · 확인 2026-11-28 (권리금의 부가세 처리는 7번 확인 필요 목록 참조)"},{"no":52,"cat":"식당·매장 (같은 자료를 쓰는 일반 개인업체)","q":"사장 월급도 비용으로 잡을 수 있나요?","short":"**개인사업자 대표 본인 급여는 비용이 되지 않습니다.** 법인 대표이사의 급여는 비용(손금)이 됩니다.","more":"개인사업자는 사업체와 대표가 법적으로 분리되지 않아, 남은 이익 전체가 이미 대표의 소득입니다. 통장에서 생활비를 인출해도 \"급여\"가 아니라 소득을 가져가는 것입니다. 대신 대표가 낸 건강보험료·장기요양보험료는 필요경비로 인정되고, 노란우산공제는 소득공제를 받을 수 있습니다. 배우자·가족에게 실제로 일한 대가를 주면 급여로 비용 인정이 가능하지만, 근무 기록·원천징수·적정 급여 수준을 갖춰야 합니다. 왜 다르냐면, 법인은 별도 인격이라 대표와 고용관계가 성립하기 때문입니다.","basis":"「소득세법」 제27조 제2항(사업자 본인 급여 불산입), 같은 법 시행령 제55조 · [국가법령정보센터](https://www.law.go.kr/법령/소득세법/제27조) · 확인 2026-11-28","expert":"소득이 커져 법인 전환을 검토하거나, 가족 급여를 비용으로 넣으려면 세무사와 상담하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/소득세법/제27조"}],"basis_text":"「소득세법」 제27조 제2항(사업자 본인 급여 불산입), 같은 법 시행령 제55조 ·  · 확인 2026-11-28"},{"no":53,"cat":"식당·매장 (같은 자료를 쓰는 일반 개인업체)","q":"직원 밥값과 명절 상여는 어떻게 처리해요?","short":"**직원 식사 제공은 복리후생비(비과세)**, 식사를 안 주고 현금으로 주면 **월 20만원까지 비과세 식대**입니다. **명절 상여는 급여(근로소득)**로 원천징수하고 4대보험 보수에 넣습니다.","more":"직원 회식·간식은 복리후생비로 처리하고, 거래처에 준 선물은 접대비(기업업무추진비)로 처리합니다. 같은 지출이라도 누구에게 줬는지로 계정이 갈립니다. 명절 상여를 현금으로 주면서 급여대장에 안 적으면 비용 인정과 4대보험 신고가 어긋납니다. 왜 나누냐면, 직원에게 주는 것은 복리후생 또는 근로소득이고, 거래처에 주는 것은 접대비이기 때문입니다. 상여 금액이 크면 원천세 부담도 함께 커집니다.","basis":"「소득세법」 제12조(식대 비과세), 제20조(근로소득), 제35조(기업업무추진비) · [국가법령정보센터](https://www.law.go.kr/법령/소득세법/제12조) · 확인 2026-11-28","expert":"상여를 성과급·수당으로 나눠 주거나, 직원 가족에게 선물을 주는 경우 과세·비과세 판단이 갈립니다. 세무사에게 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/소득세법/제12조"}],"basis_text":"「소득세법」 제12조(식대 비과세), 제20조(근로소득), 제35조(기업업무추진비) ·  · 확인 2026-11-28"},{"no":54,"cat":"지원·감면","q":"직원을 뽑으면 지원금이 있나요?","short":"**청년일자리도약장려금**이 대표적입니다. 2026년 기준 5인 이상 우선지원대상기업이 청년을 정규직으로 채용해 6개월 이상 고용하면 **1년간 최대 720만원**을 받습니다.","more":"2026년부터 수도권과 비수도권으로 나뉘었습니다. 비수도권은 기업뿐 아니라 6개월 이상 근속한 청년에게도 2년간 최대 480~720만원을 지원합니다. 채용 요건은 주 소정근로시간 28시간 이상, 최저임금 준수, 월평균 급여 450만원 이하 등입니다. 채용 후 3개월 안에 참여 신청을 해야 하고, 예산 소진 시 마감됩니다. 왜 지원하냐면, 청년 고용과 장기 근속을 유도하려는 것입니다. 두루누리(Q30)와는 별개 제도라 함께 신청할 수 있는 경우가 많습니다.","basis":"[고용24 청년일자리도약장려금(2026년)](https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systClId=SC00000117&systCnntId=CI00001042&systId=SI00000318) · 확인 2026-11-28","expert":"채용 전후로 다른 직원을 내보냈거나, 가족을 채용한 경우 지원이 제한됩니다. 고용센터·운영기관에 확인하세요. 정확한 판단은 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"고용24 청년일자리도약장려금(2026년)","u":"https://www.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systClId=SC00000117&systCnntId=CI00001042&systId=SI00000318"}],"basis_text":"확인 2026-11-28"},{"no":55,"cat":"지원·감면","q":"나이 많은 직원을 채용하면 지원이 있나요?","short":"**고령자 고용지원금**(60세 이상 증가 1명당 분기 30만원, 최대 2년), **고령자 계속고용장려금**(월 30만원, 비수도권 40만원, 최대 3년), **신중년 적합직무 지원**(중소기업 월 80만원, 1년)이 있습니다. (2026년 안내 기준, 세부 금액은 그해 지침 확인)","more":"계속고용장려금은 정년 연장·폐지·재고용 제도를 도입한 사업장이 대상이고, 고용지원금은 60세 이상 근로자 수가 늘어난 사업장이 대상입니다. 신중년 적합직무는 사전 승인이 필요합니다. 세 제도는 요건과 중복 가능 여부가 달라, 같은 직원에게 여러 개를 받을 수 없는 경우가 많습니다. 왜 나누냐면, 정년 이후 계속 고용과 신규 채용을 각각 장려하려는 것입니다. 신청 기한이 지나면 소급이 안 되니 분기마다 챙기세요.","basis":"2026년 고용장려금 사업 지침, [고용24](https://www.work24.go.kr/) · 확인 2026-11-28 (세부 금액은 7번 확인 필요 목록 참조)","expert":"정년 규정이 없거나, 60세 이상 비율이 높은 사업장은 대상 판정이 갈립니다. 고용센터에 확인하세요. 정확한 판단은 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"고용24","u":"https://www.work24.go.kr/"}],"basis_text":"2026년 고용장려금 사업 지침,  · 확인 2026-11-28 (세부 금액은 7번 확인 필요 목록 참조)"},{"no":56,"cat":"지원·감면","q":"육아휴직을 주면 지원되나요?","short":"**출산육아기 고용안정장려금**으로 육아휴직 지원금(월 30만원, 특례는 첫 3개월 월 100만원), 대체인력지원금(월 최대 140만원), 업무분담지원금(월 최대 60만원)을 받는 경우가 있습니다.","more":"우선지원대상기업이 대상이고, 육아휴직·육아기 근로시간 단축을 30일 이상 허용해야 합니다. 남성 직원의 육아휴직이나 첫 단축 허용에는 가산이 붙습니다. 대체인력지원금은 지급 임금의 80% 한도가 있습니다. 왜 지원하냐면, 직원이 육아로 경력을 끊지 않게 하려는 것입니다. 육아휴직 기간은 연차 산정에서 출근한 것으로 봅니다.","basis":"「고용보험법 시행령」 제29조, 2026년 고용장려금 사업 지침 · [고용24](https://www.work24.go.kr/) · 확인 2026-11-28 (세부 금액은 7번 확인 필요 목록 참조)","expert":"휴직자와 대체인력의 근무 기간이 겹치거나, 업무분담자를 지정한 경우 지급 요건이 복잡합니다. 고용센터에 확인하세요. 정확한 판단은 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"고용24","u":"https://www.work24.go.kr/"}],"basis_text":"「고용보험법 시행령」 제29조, 2026년 고용장려금 사업 지침 ·  · 확인 2026-11-28 (세부 금액은 7번 확인 필요 목록 참조)"},{"no":57,"cat":"지원·감면","q":"소상공인 정책자금은 어디서 신청하나요?","short":"**소상공인시장진흥공단**의 정책자금 누리집(ols.semas.or.kr)이나 지역센터에서 신청합니다. 상시근로자 5인 미만(제조·건설·운수·광업은 10인 미만)이 기본 대상입니다.","more":"일반경영안정자금은 업력과 무관하게 운전자금으로 연 7천만원까지, 5년(거치 2년 포함) 구조가 대표적입니다. 금리는 정책자금 기준금리에 사업별 가산금리를 붙입니다. 세금 체납, 신용도판단정보 등록, 휴·폐업 중이면 제한됩니다. 긴급경영안정자금은 매출 감소 등 별도 요건이 있습니다. 왜 지원하냐면, 담보가 부족한 소상공인의 자금 조달을 돕기 위해서입니다. 예산 소진 시 마감되므로 공고 일정을 먼저 확인하세요.","basis":"[소상공인시장진흥공단 2026년 정책자금](https://semas.or.kr/web/SUP01/SUP0103/SUP010301.kmdc) · 확인 2026-11-28","expert":"업종이 융자 제외 업종이거나, 체납·연체 이력이 있으면 신청 전에 정리 방향을 상담해야 합니다. 소상공인통합콜센터(1533-0100)에 문의하세요. 정확한 판단은 소상공인시장진흥공단에 확인하세요.","staff":false,"links":[{"t":"소상공인시장진흥공단 2026년 정책자금","u":"https://semas.or.kr/web/SUP01/SUP0103/SUP010301.kmdc"}],"basis_text":"확인 2026-11-28"},{"no":58,"cat":"지원·감면","q":"직원을 늘리면 세금이 줄어드나요?","short":"**통합고용세액공제**가 있습니다. 2026년부터는 직전·전전·전전전 과세연도와 각각 비교해 늘어난 인원의 금액을 **한 해에 합산**하는 방식으로 바뀌었습니다.","more":"중소기업 기준 청년등 1명당 직전 연도 대비 700만원(수도권 밖 1,000만원), 전전 대비 1,600만원(1,900만원), 전전전 대비 1,700만원(2,000만원)입니다. 근로기간 1년 미만, 월 60시간 미만 단시간, 임원, 최대주주와 그 가족은 상시근로자에서 빠집니다. 고용증대세액공제나 중소기업 사회보험료 세액공제와는 함께 받을 수 없습니다. 왜 바뀌었냐면, 인원을 유지하기만 해도 3년간 같은 공제가 반복되던 구조를 줄이려는 것입니다. 신고서에 세액공제 신청을 따로 해야 반영됩니다.","basis":"「조세특례제한법」 제29조의8(2025.12.23. 개정), 같은 법 시행령 제26조의8 · [국가법령정보센터](https://www.law.go.kr/법령/조세특례제한법/제29조의8) · 확인 2026-11-28","expert":"직원 수가 해마다 오르내리거나, 가족·단시간 직원이 섞여 있으면 공제액 계산이 복잡합니다. 세무사에게 맡기세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/조세특례제한법/제29조의8"}],"basis_text":"「조세특례제한법」 제29조의8(2025.12.23. 개정), 같은 법 시행령 제26조의8 ·  · 확인 2026-11-28"},{"no":59,"cat":"지원·감면","q":"노란우산공제는 뭔가요?","short":"소기업·소상공인이 폐업·노령 등에 대비해 매월 부금을 넣는 공제로, **소득공제**와 **압류 금지** 혜택이 있습니다.","more":"사업소득금액 구간에 따라 소득공제 한도가 달라지고, 소득이 낮을수록 한도가 큽니다. 폐업·사망·노령 등 사유가 생기면 부금과 이자를 돌려받습니다. 개인사업자뿐 아니라 법인 대표도 가입할 수 있는 경우가 있습니다. 왜 인기 있냐면, 사업 소득에서 공제되고 비상금 성격의 자금을 따로 모을 수 있기 때문입니다. 가입 전에 공제 한도와 중도해지 조건을 확인하세요.","basis":"「조세특례제한법」 제86조의3(노란우산공제), 「중소기업협동조합법」 · [중소기업중앙회 노란우산](https://www.ksbc.or.kr/) · 확인 2026-11-28 (2026년 소득공제 한도 금액은 7번 확인 필요 목록 참조)","expert":"소득 구간별 한도, 법인 대표 가입 가능 여부, 중도해지 시 불이익은 개인 상황에 따라 다릅니다. 세무사나 노란우산 상담창구에 확인하세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"중소기업중앙회 노란우산","u":"https://www.ksbc.or.kr/"}],"basis_text":"「조세특례제한법」 제86조의3(노란우산공제), 「중소기업협동조합법」 ·  · 확인 2026-11-28 (2026년 소득공제 한도 금액은 7번 확인 필요 목록 참조)"},{"no":60,"cat":"위험 신호","q":"세금계산서 없이 사고파는 거(무자료 거래), 뭐가 문제예요?","short":"**매입세액 공제를 못 받고, 그 매입을 경비로 인정받기 어렵습니다.** 게다가 미발급·거짓 기재는 처벌 대상입니다.","more":"\"세금계산서를 안 끊어 주면 싸게 준다\"는 거래는 처음엔 이익처럼 보이지만, 나중에 매출과 매입이 안 맞아 조사에서 드러납니다. 상대가 신고를 안 해 우리 매출만 잡히면 세금이 오히려 늘어납니다. 먼저 할 일은 거래처에 정상 발급을 요청하고, 이미 거래한 건은 증빙을 보완하는 것입니다. 왜 위험하냐면, 무자료 거래는 상대의 탈세를 돕는 구조라 함께 문제가 되기 때문입니다. 현금 거래도 현금영수증·계산서로 남기면 정상 거래가 됩니다.","basis":"「부가가치세법」 제39조(불공제), 「조세범 처벌법」 제10조 · [국가법령정보센터](https://www.law.go.kr/법령/조세범처벌법/제10조) · 확인 2026-11-28","expert":"이미 무자료 거래가 몇 년치 쌓였거나, 세무조사 통지를 받았다면 즉시 세무사에게 가져가세요. 정확한 판단은 세무사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/조세범처벌법/제10조"}],"basis_text":"「부가가치세법」 제39조(불공제), 「조세범 처벌법」 제10조 ·  · 확인 2026-11-28"},{"no":61,"cat":"위험 신호","q":"일하지 않은 사람 월급을 올렸어요(가공 인건비).","short":"**비용이 전액 부인되고 가산세가 붙으며, 조세포탈로 형사처벌까지 갈 수 있습니다.**","more":"가족·지인 이름으로 급여를 계상하면, 세무서는 통장 이체·출퇴근 기록·원천세 신고를 대조합니다. 실제 근무가 확인되지 않으면 필요경비가 빠지고, 그 돈은 대표에게 지급된 것으로 보아 소득세가 다시 매겨집니다. 먼저 할 일은 가공으로 계상한 금액을 특정해 수정신고하는 것입니다. 왜 중대하냐면, 단순 실수가 아니라 세금을 빼돌리려는 행위로 보기 때문입니다. 가족에게 실제로 일한 대가를 주는 것은 적법하지만, 근무 기록과 적정 급여를 갖춰야 합니다.","basis":"「소득세법」 제27조, 제41조(부당행위계산), 「조세범 처벌법」 제3조(조세포탈) · [국가법령정보센터](https://www.law.go.kr/법령/조세범처벌법/제3조) · 확인 2026-11-28","expert":"이미 신고가 끝났다면 수정신고·경정청구의 방향과 처벌 감면 여부를 세무사·변호사와 함께 판단해야 합니다. 정확한 판단은 세무사나 변호사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/조세범처벌법/제3조"}],"basis_text":"「소득세법」 제27조, 제41조(부당행위계산), 「조세범 처벌법」 제3조(조세포탈) ·  · 확인 2026-11-28"},{"no":62,"cat":"위험 신호","q":"4대보험을 안 들었어요.","short":"**소급 가입·보험료 추징과 과태료**가 붙고, 직원이 공단에 직접 신고할 수 있습니다. 그 사이 산재가 나면 회사가 전액 부담할 위험이 커집니다.","more":"직원이 퇴사 후 실업급여를 신청하거나 병원비를 청구할 때 미가입이 드러나는 경우가 많습니다. 먼저 할 일은 미가입 기간과 대상을 정리해 자진 신고하는 것입니다. 자진 신고가 적발 후보다 과태료·가산세 측면에서 유리한 경우가 있습니다. 왜 위험하냐면, 4대보험은 직원의 치료·실업·노후를 담보하는 제도라 회사가 임의로 빼면 안 되기 때문입니다.","basis":"「고용보험법」 제118조(과태료), 「국민건강보험법」·「국민연금법」의 가입 규정 · [4대보험 정보연계센터](https://www.4insure.or.kr/pbiz/feii/inscIntroView.do) · 확인 2026-11-28","expert":"미가입 기간이 길거나 직원과 다툼이 있으면 노무사·세무사와 함께 소급 신고와 과태료 감면을 확인하세요. 정확한 판단은 근로복지공단이나 노무사에 확인하세요.","staff":false,"links":[{"t":"4대보험 정보연계센터","u":"https://www.4insure.or.kr/pbiz/feii/inscIntroView.do"}],"basis_text":"「고용보험법」 제118조(과태료), 「국민건강보험법」·「국민연금법」의 가입 규정 ·  · 확인 2026-11-28"},{"no":63,"cat":"위험 신호","q":"세금계산서를 꾸며 냈어요(허위 세금계산서).","short":"**3년 이하 징역 또는 공급가액의 부가세액 3배 이하 벌금**까지 갈 수 있습니다. 알선·중개한 사람도 같은 형량입니다.","more":"실제 거래 없이 세금계산서를 발급·수취하면 조세범처벌법 제10조 제3항입니다. 실물 거래가 있었어도 실제 공급자가 아닌 사람 명의로 받으면 같은 조항으로 볼 수 있습니다. 영리를 목적으로 공급가액 합계가 30억원을 넘으면 특정범죄가중처벌법이 적용됩니다. 먼저 할 일은 발급·수취 경위와 금액을 정리해 변호사에게 보여 주는 것입니다. 왜 중대하냐면, 세금계산서는 세금 계산의 기초라 한 장이 여러 사람의 신고를 오염시키기 때문입니다.","basis":"「조세범 처벌법」 제10조 제3항·제4항, 제22조(공소시효 7년) · [국가법령정보센터](https://law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1022173031) · 확인 2026-11-28","expert":"수사 통지·세무조사 통지를 받았다면 답변 전에 변호사와 상의하세요. 정확한 판단은 변호사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1022173031"}],"basis_text":"「조세범 처벌법」 제10조 제3항·제4항, 제22조(공소시효 7년) ·  · 확인 2026-11-28"},{"no":64,"cat":"위험 신호","q":"근로계약서를 안 썼어요.","short":"**500만원 이하 벌금** 대상이고, 분쟁이 생기면 사장이 불리해집니다. 아르바이트·기간제에도 똑같이 적용됩니다.","more":"임금, 소정근로시간, 휴일, 연차를 적은 서면을 근로계약을 맺을 때 교부해야 합니다. 근로자 명부·임금대장·임금명세서는 별도로 과태료 대상입니다(각 30만~100만원 수준). 먼저 할 일은 지금 일하는 직원 전원의 계약서를 작성해 서명본을 주고받는 것입니다. 왜 엄격하냐면, 근로조건이 문서로 없으면 임금·시간 다툼에서 증명할 방법이 없기 때문입니다. 표준 근로계약서는 고용노동부 자료실에서 내려받을 수 있습니다.","basis":"「근로기준법」 제17조(근로조건 명시), 제114조 제1호(500만원 이하 벌금), 제48조(임금명세서) · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제17조) · 확인 2026-11-28","expert":"이미 근로자가 진정을 넣었거나, 계약서 내용이 실제와 다르면 노무사에게 확인하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제17조"}],"basis_text":"「근로기준법」 제17조(근로조건 명시), 제114조 제1호(500만원 이하 벌금), 제48조(임금명세서) ·  · 확인 2026-11-28"},{"no":65,"cat":"위험 신호","q":"남의 명의로 사업자를 냈어요.","short":"**명의대여 가산세(공급가액의 2%)**와 처벌 대상이 됩니다. 그 명의자의 체납·신용 문제까지 떠안을 수 있습니다.","more":"타인 명의로 사업자등록을 하거나 그 명의를 이용해 사업하면 가산세가 붙습니다. 명의자는 세금 고지·체납·사업 책임을 지게 되고, 실제 사업자는 세금계산서·계좌를 자기 이름으로 못 만들어 계속 문제가 생깁니다. 먼저 할 일은 실제 사업자 명의로 정정하는 것입니다. 왜 위험하냐면, 세금은 명의자에게 고지되지만 실제 이익은 다른 사람이 가져가 분쟁이 길어지기 때문입니다. 사업자 명의는 절대 빌려주거나 빌리지 마세요.","basis":"「부가가치세법」 제60조 제1항 제2호(2% 가산세) · [국가법령정보센터](https://www.law.go.kr/법령/부가가치세법/제60조) · 확인 2026-11-28","expert":"이미 명의대여로 거래가 이루어졌다면 세무사·변호사와 정정 순서를 정해야 합니다. 정확한 판단은 세무사나 변호사에게 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/부가가치세법/제60조"}],"basis_text":"「부가가치세법」 제60조 제1항 제2호(2% 가산세) ·  · 확인 2026-11-28"},{"no":66,"cat":"위험 신호","q":"직원 월급을 밀렸어요.","short":"**임금체불**로 형사처벌 대상이 될 수 있고, 체불 명단 공개·각종 지원 제한이 따릅니다.","more":"직원이 퇴직하면 14일 안에 임금을 청산해야 합니다. 경영이 어렵다면 근로자와 지급 일정을 합의하고 서면으로 남기는 것이 최선입니다. 체불이 확인되면 고용노동부의 시정 지시를 받고, 반복되면 명단이 공개됩니다. 체불 사업주는 정부 지원금·정책자금 신청에서도 제한될 수 있습니다. 왜 중대하냐면, 임금은 직원의 생활비라 다른 채무보다 우선 보호되기 때문입니다. 먼저 할 일은 체불 내역을 직원별로 정리해 지급 계획을 세우는 것입니다.","basis":"「근로기준법」 제36조(금품 청산), 제109조(3년 이하 징역 또는 3천만원 이하 벌금) · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제36조) · 확인 2026-11-28","expert":"진정서가 접수됐거나 체불액이 크면 노무사·변호사와 함께 대응하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":false,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제36조"}],"basis_text":"「근로기준법」 제36조(금품 청산), 제109조(3년 이하 징역 또는 3천만원 이하 벌금) ·  · 확인 2026-11-28"},{"no":67,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"올해 최저임금은 얼마인가요?","short":"**2026년 시급 10,320원, 월 2,156,880원**(주 40시간·월 209시간 기준)입니다. **2027년은 시급 10,700원, 월 2,236,300원**입니다.","more":"업종 구분 없이 모든 사업장에 똑같이 적용됩니다. 수습 중이라도 1년 이상 계약하고 수습 시작 3개월 이내일 때만 10% 감액이 가능하며, 단순노무직(한국표준직업분류 대분류 9)은 감액할 수 없습니다. 최저임금에는 기본급뿐 아니라 정기적·일률적으로 지급되는 수당이 포함되고, 식대·교통비처럼 실비 성격은 제외되는 경우가 많습니다. 왜 매년 바뀌냐면, 물가와 임금 수준을 반영해 매년 8월에 다음 해 금액을 고시하기 때문입니다.","basis":"「최저임금법」 제10조, 2026년·2027년 적용 최저임금 고시 · [고용노동부 노동포털 최저임금](https://labor.moel.go.kr/minwonSysInfo/minwagesys.do) · 확인 2026-11-28","expert":"수당이 최저임금에 포함되는지, 감액이 적법한지 다툼이 있으면 노무사나 고용노동부(1350)에 확인하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":true,"links":[{"t":"고용노동부 노동포털 최저임금","u":"https://labor.moel.go.kr/minwonSysInfo/minwagesys.do"}],"basis_text":"「최저임금법」 제10조, 2026년·2027년 적용 최저임금 고시 ·  · 확인 2026-11-28"},{"no":68,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"주휴수당은 언제 나오나요?","short":"**4주 평균 주 15시간 이상** 일하고, 그 주의 **소정근로일을 개근**하고, 그 주 **근로관계가 유지**되면 1일치 임금이 붙습니다.","more":"계산은 통상시급 × 1일 소정근로시간입니다. 주 15시간이면 3시간분(2026년 최저임금 기준 30,960원), 주 40시간이면 8시간분입니다. 지각·조퇴는 결근이 아니고, 연차를 하루 써도 나머지 날을 나오면 개근입니다. 5인 미만 사업장도 주휴수당은 적용됩니다. 왜 생기냐면, 일주일을 채워 일한 사람에게 하루 쉴 수 있는 임금을 보장하려는 것입니다. 퇴사하는 주에는 마지막 근무일과 주휴일 관계로 갈리니 급여명세서를 확인하세요.","basis":"「근로기준법」 제55조, 같은 법 시행령 제30조 · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제55조) · 확인 2026-11-28","expert":"주마다 근무시간이 들쭉날쭉하거나, 15시간 경계에 걸치면 계산이 갈립니다. 고용노동부(1350)에 근무표를 가지고 확인하세요. 정확한 판단은 고용노동부(1350)에 확인하세요.","staff":true,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제55조"}],"basis_text":"「근로기준법」 제55조, 같은 법 시행령 제30조 ·  · 확인 2026-11-28"},{"no":69,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"연차는 며칠인가요?","short":"**1년 미만은 1개월 개근 시 1일(최대 11일)**, **1년 이상 80% 이상 출근하면 15일**, **3년 이상은 2년마다 1일씩 늘어 최대 25일**입니다.","more":"1년 미만의 월 단위 연차는 입사 1년이 지나면 쓰지 못한 것이 소멸합니다. 1년 이상 근로자의 연차는 발생일부터 1년간 사용할 수 있습니다. 회사가 연차 사용을 촉진하지 않았는데 못 쓰게 했다면 수당으로 청구할 수 있는 경우가 있습니다. 육아휴직·업무상 부상 휴업 기간은 출근한 것으로 봅니다. 왜 해마다 늘어나냐면, 근속에 따른 휴식 필요를 반영하기 때문입니다.","basis":"「근로기준법」 제60조(연차 유급휴가) · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제60조) · 확인 2026-11-28","expert":"회계연도 기준으로 연차를 부여했거나, 출근율 계산이 복잡하면 노무사에게 확인하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":true,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제60조"}],"basis_text":"「근로기준법」 제60조(연차 유급휴가) ·  · 확인 2026-11-28"},{"no":70,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"야근·휴일 수당은 어떻게 계산하나요?","short":"**연장·야간(22시~06시)·휴일 근로**는 통상임금의 **50% 이상**을 더 줍니다. 휴일 8시간 초과분은 100% 가산입니다.","more":"연장근로는 1주 12시간 한도이고, 근로자와 합의한 서면(근로계약·취업규칙)이 있어야 합니다. 5인 이상 사업장에 적용되고, 5인 미만이면 가산수당 의무가 없습니다. 포괄임금제로 월급에 수당을 포함했다면, 실제 근로시간과 비교해 부족분이 있는지 확인해야 합니다. 왜 가산하냐면, 법정 근로시간을 넘긴 노동에 대한 대가와 건강 보호를 위해서입니다. 근무기록(출퇴근·근무표)을 남겨 두면 나중에 계산 근거가 됩니다.","basis":"「근로기준법」 제53조(연장 한도), 제56조(가산임금) · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제56조) · 확인 2026-11-28","expert":"포괄임금제·교대제·격일제처럼 계산이 복잡하면 노무사에게 확인하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":true,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제56조"}],"basis_text":"「근로기준법」 제53조(연장 한도), 제56조(가산임금) ·  · 확인 2026-11-28"},{"no":71,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"퇴직금은 얼마인가요?","short":"**1년 이상** 근무하고 주 15시간 이상이면, **1년에 30일분 이상의 평균임금**을 퇴직 후 **14일 이내**에 받습니다.","more":"평균임금은 퇴직 전 3개월 임금 총액을 그 기간 총일수로 나눈 금액입니다. 상여·연장수당이 포함되면 금액이 커집니다. 회사가 퇴직연금에 가입했다면 적립금으로 받습니다. 14일이 지나도 안 주면 지연이자를 청구할 수 있고, 노동청에 진정할 수 있습니다. 왜 1년이냐면, 단기 근로까지 의무를 지우면 소규모 사업장이 감당하기 어렵기 때문입니다. 퇴직금을 주는 대신 \"3.3% 사업소득\"으로 처리하는 것은 위법 소지가 큽니다.","basis":"「근로자퇴직급여 보장법」 제4조, 제8조, 제9조 · [국가법령정보센터](https://www.law.go.kr/법령/근로자퇴직급여보장법/제8조) · 확인 2026-11-28","expert":"평균임금 산정, 육아휴직 기간 처리, 퇴직연금 정산은 노무사에게 확인하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":true,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로자퇴직급여보장법/제8조"}],"basis_text":"「근로자퇴직급여 보장법」 제4조, 제8조, 제9조 ·  · 확인 2026-11-28"},{"no":72,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"4대보험은 얼마나 빠지나요?","short":"2026년 직원 부담은 **국민연금 4.75%, 건강보험 3.595%, 장기요양보험료(건강보험료의 약 13.14%의 절반), 고용보험 0.9%**입니다.","more":"월급 200만원이면 건강보험료 71,900원, 장기요양 9,440원, 국민연금 95,000원, 고용보험 18,000원 정도가 빠지는 식입니다(사업장 요율·보수월액에 따라 달라짐). 산재보험은 회사가 전액 내므로 급여에서 빠지지 않습니다. 두루누리 지원을 받는 사업장이면 직원 부담분도 줄어듭니다. 왜 절반씩이냐면, 사회보험은 회사와 직원이 함께 부담하도록 설계됐기 때문입니다. 급여명세서의 공제 내역과 4대보험 공제액이 다르면 회사에 확인을 요청하세요.","basis":"[4대사회보험 정보연계센터(2026년)](https://www.4insure.or.kr/pbiz/feii/inscIntroView.do), [보건복지부 2026년 건강보험료율](https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1487279&mid=a10503000000) · 확인 2026-11-28","expert":"공제액이 예상과 다르거나, 가입이 안 된 것 같으면 국민건강보험공단(1577-1000)·국민연금공단(1355)에서 가입 내역을 확인하세요. 정확한 판단은 해당 공단에 확인하세요.","staff":true,"links":[{"t":"4대사회보험 정보연계센터(2026년)","u":"https://www.4insure.or.kr/pbiz/feii/inscIntroView.do"},{"t":"보건복지부 2026년 건강보험료율","u":"https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1487279&mid=a10503000000"}],"basis_text":",  · 확인 2026-11-28"},{"no":73,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"급여명세서를 받을 수 있나요?","short":"네. 임금을 지급할 때 **구성항목·계산방법·공제내역**을 적은 임금명세서를 **서면 또는 전자문서**로 받을 권리가 있습니다.","more":"2021년 11월부터 5인 미만 사업장을 포함해 모든 사업장에 적용됩니다. 명세서가 없거나 총액만 적혀 있으면 임금체불 분쟁에서 직원이 불리해집니다. 회사가 안 주면 고용노동부에 신고할 수 있고, 과태료 대상입니다. 왜 의무화했냐면, 직원이 자기 임금이 어떻게 계산됐는지 알 수 있어야 부당 공제를 막을 수 있기 때문입니다. 받은 명세서는 3년 정도 보관해 두면 나중에 퇴직금·실업급여 확인에 도움이 됩니다.","basis":"「근로기준법」 제48조 제2항(임금명세서), 제116조(과태료) · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제48조) · 확인 2026-11-28","expert":"명세서 공제 내역이 설명과 다르면 노무사나 고용노동부(1350)에 상담하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":true,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제48조"}],"basis_text":"「근로기준법」 제48조 제2항(임금명세서), 제116조(과태료) ·  · 확인 2026-11-28"},{"no":74,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"갑자기 해고한다고 하는데, 맞나요?","short":"해고는 **30일 전에 서면으로 예고**하거나 **30일분 통상임금**을 주어야 하고, **해고 사유와 시기를 서면으로** 알려야 합니다.","more":"계속 근로 3개월 미만이거나, 천재지변·근로자의 고의적 방해 등이면 예고 없이 해고할 수 있습니다. 정당한 이유 없는 해고는 부당해고로 노동위원회에 구제신청을 할 수 있습니다. 권고사직은 직원이 동의해야 성립하고, 서명을 강요받았다면 다툴 수 있습니다. 왜 예고를 요구하냐면, 갑작스러운 실직으로 생계가 끊기지 않게 하려는 것입니다. 해고 통지는 말이 아니라 서면이어야 효력이 있습니다.","basis":"「근로기준법」 제26조(해고예고), 제27조(해고사유 서면 통지) · [국가법령정보센터](https://www.law.go.kr/법령/근로기준법/제26조) · 확인 2026-11-28","expert":"해고 통지를 받았다면 3개월 안에 노동위원회 구제신청을 검토하세요. 대한법률구조공단(132)에서 상담받을 수 있습니다. 정확한 판단은 노무사나 대한법률구조공단(132)에 확인하세요.","staff":true,"links":[{"t":"국가법령정보센터","u":"https://www.law.go.kr/법령/근로기준법/제26조"}],"basis_text":"「근로기준법」 제26조(해고예고), 제27조(해고사유 서면 통지) ·  · 확인 2026-11-28"},{"no":75,"cat":"직원에게 알려 줄 것 `[직원용]`","q":"수습 기간엔 최저임금을 덜 줘도 되나요?","short":"**1년 이상 기간을 정한 근로계약**을 맺고 **수습 시작 3개월 이내**일 때만 최저임금의 **10%를 감액**할 수 있습니다. 단순노무직은 감액할 수 없습니다.","more":"수습이 3개월을 넘거나, 계약 기간이 1년 미만이면 감액은 위법입니다. 감액하려면 근로계약서에 그 내용이 적혀 있어야 합니다. 단순노무업무(한국표준직업분류 대분류 9)에 종사하면 수습 여부·계약기간과 관계없이 최저임금 100%를 받습니다. 왜 예외를 두냐면, 업무 숙련 전 기간의 교육 부담을 고려한 것입니다. 감액된 급여를 받았다면 계약서와 급여명세서를 확인하세요.","basis":"「최저임금법」 제5조, 같은 법 시행령 제3조 · [고용노동부 노동포털 최저임금](https://labor.moel.go.kr/minwonSysInfo/minwagesys.do) · 확인 2026-11-28","expert":"감액이 적법한지 다툼이 있으면 고용노동부(1350)나 대한법률구조공단(132)에 상담하세요. 정확한 판단은 노무사나 고용노동부(1350)에 확인하세요.","staff":true,"links":[{"t":"고용노동부 노동포털 최저임금","u":"https://labor.moel.go.kr/minwonSysInfo/minwagesys.do"}],"basis_text":"「최저임금법」 제5조, 같은 법 시행령 제3조 ·  · 확인 2026-11-28"}],"guides":[{"id":"5-1","title":"직원을 처음 뽑았을 때 (6단계)","steps":[{"h":"근로계약서 작성·교부","b":"임금, 소정근로시간, 휴일, 연차를 적어 서면(전자문서 포함)으로 줍니다. 아르바이트·기간제도 똑같습니다. 안 쓰면 500만원 이하 벌금 대상입니다(Q64)."},{"h":"4대보험 취득 신고","b":"건강보험이 14일로 가장 짧습니다. 4대사회보험 정보연계센터에서 네 기관을 한 번에 신고하세요(Q28)."},{"h":"두루누리 신청 검토","b":"10명 미만 사업장이고 월 보수 270만원 미만 신규 직원이면 80% 지원 대상일 수 있습니다(Q30). 신청이 늦으면 소급이 제한됩니다."},{"h":"급여 지급 방식 정하기","b":"계좌이체를 원칙으로 하고, 급여대장·임금명세서를 매월 남깁니다(Q73). 비과세 식대를 줄 경우 급여규정에 근거를 둡니다(Q43)."},{"h":"원천세 신고 일정 등록","b":"다음 달 10일(또는 반기납부면 7월·1월 10일)을 달력에 넣습니다(Q16·Q22). 첫 달에 놓치는 경우가 가장 많습니다."},{"h":"첫 급여명세서 점검","b":"4대보험 공제액, 연장·야간 수당, 주휴수당이 빠지지 않았는지 확인합니다(Q68·Q70·Q72)."}]},{"id":"5-2","title":"일용직을 하루 썼을 때 (5단계)","steps":[{"h":"일당과 근무일 기록","b":"이름, 연락처, 주민번호(또는 외국인등록번호), 근무일, 일당을 남깁니다."},{"h":"원천세 계산·납부","b":"(일당 − 15만원) × 6% × 45%로 소득세를 계산하고 지방소득세 10%를 더해, 다음 달 10일까지 신고·납부합니다(Q17)."},{"h":"일용근로소득 지급명세서 제출","b":"지급한 달의 다음 달 말일까지 홈택스에서 제출합니다(Q19)."},{"h":"고용·산재보험 근로내용확인신고","b":"다음 달 15일까지 근로복지공단에 신고합니다(Q27). 이 신고가 취업·실업급여의 근거가 됩니다."},{"h":"3개월 규칙 확인","b":"같은 사람이 계속 나오면 일반 근로자로 전환해야 합니다(Q23). 3개월이 지나기 전에 4대보험·근로계약을 정리하세요."}]},{"id":"5-3","title":"원청에서 인건비를 받았을 때 (6단계)","steps":[{"h":"받은 돈의 성격 확인","b":"용역 대가인지, 인건비 실비 정산인지 계약서로 확인합니다(Q34)."},{"h":"정산용 계좌로 분리","b":"운영비와 섞지 않고, 원청별·현장별로 입금을 표시합니다."},{"h":"세금계산서 발행","b":"용역을 제공한 때(공급시기)에 맞춰 발행합니다(Q9). 원천징수로 처리하자는 요구는 계약과 세무 처리에 따라 달라지므로 임의로 따르지 않습니다."},{"h":"직원 급여 지급·원천세","b":"급여대장을 만들고 다음 달 10일까지 원천세를 신고합니다(Q16)."},{"h":"4대보험 정산","b":"인원이 늘었으면 취득 신고, 보수 변동이 있으면 보수월액 변경을 확인합니다(Q28·Q31)."},{"h":"남은 차액 확인","b":"받은 인건비에서 실제 지급한 급여·4대보험 회사 부담분을 빼고, 미지급분이 없는지 매월 확인합니다."}]},{"id":"5-4","title":"부가세 신고 달이 됐을 때 (6단계)","steps":[{"h":"과세유형·신고기한 확인","b":"개인 일반 7월 25일·1월 25일, 간이 1월 25일, 법인은 분기입니다(Q7)."},{"h":"매출 모으기","b":"홈택스 카드·현금영수증 매출, 배달앱·오픈마켓 신고자료, 세금계산서 발행분을 합칩니다(Q48·Q49)."},{"h":"매입 모으기","b":"세금계산서, 카드전표, 현금영수증, 의제매입세액 대상 면세 농산물 증빙을 챙깁니다(Q10·Q50)."},{"h":"공제·경감 확인","b":"카드 매출 세액공제(1.3%, 연 1,000만원), 의제매입세액, 공통매입세액 안분을 확인합니다(Q11·Q15·Q50)."},{"h":"신고서 작성·납부","b":"신고와 납부를 같은 날 끝냅니다. 납부를 미루면 하루 0.022%가 붙습니다(Q13)."},{"h":"증빙 보관","b":"신고서, 세금계산서 합계표, 카드·현금영수증 명세를 5년간 보관합니다(「국세기본법」 제85조의3). 근로계약서·임금대장은 3년입니다."}]},{"id":"5-5","title":"직원이 그만뒀을 때 (6단계)","steps":[{"h":"퇴사일·상실일 정리","b":"상실일은 마지막 근무일의 **다음 날**입니다(Q29)."},{"h":"4대보험 상실 신고","b":"건강보험 14일, 나머지 다음 달 15일까지. 이직확인서를 함께 내면 직원이 실업급여를 빨리 받습니다."},{"h":"최종 급여·퇴직금 정산","b":"급여는 14일 안에 지급하고, 1년 이상이면 퇴직금을 계산합니다(Q21·Q71)."},{"h":"원천세·지급명세서","b":"마지막 달 급여의 원천세를 신고하고, 근로소득 지급명세서에 퇴직 사실을 반영합니다(Q19)."},{"h":"임금명세서·서류 보관","b":"근로계약서, 임금대장, 근로자 명부는 3년간 보관합니다(Q64)."},{"h":"인수인계·비품 회수","b":"현장 열쇠·장비·차량을 회수하고, 남은 연차수당이 있으면 정산합니다(Q69)."}]},{"id":"5-6","title":"세무서에서 연락이 왔을 때 (5단계)","steps":[{"h":"연락의 종류 확인","b":"안내문(신고 안내), 확인서 요구, 세무조사 통지, 고지서 중 무엇인지 확인합니다. 전화만으로는 단정하지 말고 문서를 요청하세요."},{"h":"기한 확인","b":"문서에 적힌 답변·제출 기한을 달력에 표시합니다. 기한을 넘기면 가산세·과태료가 붙습니다(Q13)."},{"h":"자료 준비","b":"매출·매입 장부, 급여대장, 4대보험 신고 내역, 계좌 거래내역을 기간별로 모읍니다."},{"h":"혼자 답변하지 않기","b":"특히 \"확인서\" 요구나 조사 통지는 답변 내용이 이후 판단의 근거가 됩니다. 세무사와 먼저 상의하세요."},{"h":"수정신고·이의신청 검토","b":"단순 착오면 수정신고로 가산세를 줄일 수 있고, 처분이 부당하면 이의신청·심판청구 기한이 따로 있습니다. 세무사와 상의하세요."}]},{"id":"5-7","title":"식당·매장을 처음 열 때 (6단계)","steps":[{"h":"사업자등록","b":"개업일부터 20일 이내, 업종코드를 실제 영업(음식점·소매·서비스)에 맞게 넣습니다(Q1·Q2)."},{"h":"과세유형 판단","b":"매출 예상액이 1억 400만원 미만이면 간이과세가 가능한 경우가 많지만, 배제 업종인지 확인합니다(Q2)."},{"h":"카드·현금영수증 가맹","b":"카드 단말기와 현금영수증 가맹점을 가입합니다. 손님이 요구하면 발급해야 하고, 미발급·거부는 과태료 대상입니다."},{"h":"배달앱 정산 구조 확인","b":"수수료율, 배달비 부담 주체, 부가세 신고자료 제공 여부를 앱별로 확인합니다(Q48·Q49)."},{"h":"직원 계약·4대보험","b":"홀·주방 알바의 소정근로시간을 계약서에 적고, 15시간·60시간 기준을 확인합니다(Q47)."},{"h":"식자재 증빙 루틴","b":"시장·도매상에서 현금영수증·계산서를 받는 습관을 만들고, 면세 농산물은 의제매입세액 증빙으로 모읍니다(Q50)."}]},{"id":"5-8","title":"가게를 접을 때 (6단계)","steps":[{"h":"폐업일 확정","b":"폐업일이 모든 신고 기한의 기준이 됩니다. 임대차 종료일과 맞춰 정합니다."},{"h":"재고·비품 목록","b":"남은 재고는 시가로, 비품·차량은 취득가액과 보유기간으로 정리합니다(Q51)."},{"h":"폐업 신고","b":"홈택스 또는 세무서에 사업자등록 폐업 신고를 합니다(Q6)."},{"h":"폐업 부가세 신고","b":"폐업한 달의 다음 달 25일까지, 잔존재화를 포함해 신고합니다(Q6·Q51)."},{"h":"직원 정리","b":"4대보험 상실 신고, 최종 급여·퇴직금 지급, 근로계약서·임금대장 보관을 확인합니다(Q29·Q21)."},{"h":"종합소득세 신고","b":"다음 해 5월에 폐업분까지 합쳐 신고합니다. 적자여도 신고해야 경비·공제가 인정됩니다."}]}],"phones":[{"g":"all","name":"국세청 국세상담센터","num":"126","what":"세금 신고·납부·계산 방법, 부가세·원천세·소득세 일반 상담. 가장 먼저 거는 곳"},{"g":"all","name":"정부민원안내","num":"110","what":"어느 기관에 물어야 할지 모를 때"},{"g":"all","name":"고용노동부 고객상담센터","num":"1350","what":"근로계약·임금·주휴·연차·해고·임금체불 상담, 근로감독관 연결"},{"g":"all","name":"근로복지공단","num":"1588-0075","what":"고용보험·산재보험 가입, 보수총액·근로내용확인신고, 두루누리"},{"g":"all","name":"국민건강보험공단","num":"1577-1000","what":"건강보험·장기요양 가입, 보수월액, 피부양자, 보험료 문의"},{"g":"all","name":"국민연금공단","num":"1355","what":"국민연금 가입·납부, 두루누리 연금보험료 지원, 기준소득월액"},{"g":"all","name":"소상공인시장진흥공단","num":"1533-0100","what":"소상공인 정책자금, 채무조정, 재기지원"},{"g":"all","name":"중소기업 통합콜센터","num":"1357","what":"중소기업 지원사업 전반, 정책자금 안내"},{"g":"all","name":"대한법률구조공단","num":"132","what":"무료 법률상담(임금·계약·손해배상), 소송 구조"}]};

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);return migrate(o);}}catch(e){}
  return seed();
}
function migrate(o){
  const s=seed();
  const out=Object.assign({},s,o);
  out.company=Object.assign({},s.company,o.company||{});
  out.team=Array.isArray(o.team)&&o.team.length?o.team:s.team;
  out.notices=Array.isArray(o.notices)?o.notices:s.notices;
  out.logs=Array.isArray(o.logs)?o.logs:s.logs;
  out.sched=Array.isArray(o.sched)?o.sched:s.sched;
  out.todos=Array.isArray(o.todos)?o.todos:s.todos;
  out.att=o.att&&typeof o.att==='object'?o.att:s.att;
  out.logDraft=Object.assign({},s.logDraft,o.logDraft||{});
  if(!PRESETS[out.preset])out.preset='shop';
  if(out.mode!=='shop'&&out.mode!=='company')out.mode='shop';
  if(!['boss','manager','staff'].includes(out.role))out.role='boss';
  return out;
}

  if(S.preset==='logistics')return box([['오늘 입고','12건'],['오늘 출고','34건'],['피킹 처리','480건'],['지연·막힘','1건 (지게차)']]);
  if(S.preset==='manufacture')return box([['생산수량','1,240개'],['불량','6개 (0.5%)'],['주간조 / 야간조','8명 / 6명'],['설비 정지','1회 (12분)']]);
  if(S.preset==='construction')return box([['투입 현장','3곳'],['투입 인원','12명'],['평균 공정','62%'],['자재 입고','2회']]);

function shrink(file,cb){
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{
    const max=900;let w=img.width,h=img.height;
    if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    try{cb(c.toDataURL('image/jpeg',0.72));}catch(e){toast('사진을 처리하지 못했습니다');}
  };img.onerror=()=>toast('이미지를 읽지 못했습니다');img.src=r.result;};
  r.onerror=()=>toast('파일을 읽지 못했습니다');
  r.readAsDataURL(file);
}

    return '<details class="qa" data-cat="'+esc(it.cat)+'" data-no="'+it.no+'" data-staff="'+(it.staff?'1':'0')+'">'+

      (it.basis_text||links?'<div class="basis">근거 · '+esc(it.basis_text||'')+(links?' · '+links:'')+' <span class="tiny">(확인 '+(TAX.checked)+')</span></div>':'')+
      (it.expert?'<div class="expert">'+rich(it.expert)+'</div>':'')+
      '</div></details>';
  }).join('');

}
const TAX_POPULAR=[17,25,30,47,21,7,69,52];
function filterTax(){
  if(!TAX)return;
  const q=(taxQuery||'').trim().toLowerCase().replace(/\s+/g,'');
  const nodes=$$('#taxList details.qa');
  const byNo={}; nodes.forEach(d=>byNo[d.dataset.no]=d);
  const scored=[];
  TAX.items.forEach(it=>{
    const catOk=taxCat==='전체'||it.cat===taxCat||(taxCat==='직원용'&&it.staff);
    if(!catOk)return;
    const qq=(it.q||'').toLowerCase().replace(/\s+/g,'');
    const ss=(it.short||'').toLowerCase().replace(/\s+/g,'');
    const mm=(it.more||'').toLowerCase().replace(/\s+/g,'');
    let sc=0;
    if(q){
      if(qq.includes(q))sc+=100;
      if(ss.includes(q))sc+=30;
      if(mm.includes(q))sc+=8;
      if(!sc)return;
    } else if(taxCat==='전체'){
      sc=TAX_POPULAR.indexOf(it.no)>=0?(100-TAX_POPULAR.indexOf(it.no)):(taxShowAll?1:0);
      if(!sc)return;
    }
    scored.push({it:it,sc:sc});
  });
  scored.sort((a,b)=>b.sc-a.sc||a.it.no-b.it.no);
  const total=scored.length;
  const limit=q?(taxShowAll?999:3):(taxShowAll?999:(taxCat==='전체'?TAX_POPULAR.length:8));
  const list=$('#taxList');
  nodes.forEach(d=>{d.classList.add('hidden');});
  const used={};
  scored.forEach(x=>{const d=byNo[String(x.it.no)];if(d){list.appendChild(d);used[String(x.it.no)]=1;}});
  nodes.forEach(d=>{if(!used[d.dataset.no])list.appendChild(d);});
  scored.slice(0,limit).forEach(x=>{const d=byNo[String(x.it.no)];if(d)d.classList.remove('hidden');});
  const cnt=$('#taxCount');
  if(cnt)cnt.textContent=q?(total+'개 결과'+(total>limit?' · '+limit+'개 표시':'')):(taxCat==='전체'?'전체 '+TAX.items.length+'문항 중 '+Math.min(limit,total)+'개':taxCat+' '+total+'문항'+(total>limit?' 중 '+limit+'개':''));
  const head=$('#taxHead');
  if(head)head.textContent=q?'"'+(taxQuery||'').trim()+'" 검색 결과':(taxCat==='전체'?'자주 찾는 질문':taxCat);
  const btn=$('#taxAllBtn');
  if(btn)btn.textContent=taxShowAll?'접기':(q?'검색 결과 '+total+'개 모두 보기':(taxCat==='전체'?'전체 문항 보기':taxCat+' '+total+'문항 모두 보기'));
}
